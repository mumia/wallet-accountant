# Self-hosting (ADR-0005, ADR-0016): the app in all mode, migrate as a
# one-shot service, PostgreSQL, Zitadel and the OpenTelemetry Collector.
# Tempo, Prometheus, Loki and Grafana start only with the observability
# profile. Use the Make targets: `make up` (or `make up-observability`), then
# `make bootstrap` for the first Instance administrator's Invitation code
# (ADR-0017). `make up` writes the secrets to .env on first use.
name: wallet-accountant

x-app: &app
  image: wallet-accountant:local
  build: .
  restart: unless-stopped
  environment: &app-environment
    WA_DATABASE_URL: postgres://wa_app:${WA_APP_PASSWORD:?run make up, which writes .env}@postgres:5432/wallet_accountant?sslmode=disable
    WA_READER_DATABASE_URL: postgres://wa_event_store_reader:${WA_READER_PASSWORD:?run make up, which writes .env}@postgres:5432/wallet_accountant?sslmode=disable
    WA_OIDC_ISSUER: http://${AUTH_DOMAIN:-auth.localhost}:${AUTH_PORT:-8081}
    WA_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wallet-accountant}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_SERVICE_NAME: wallet-accountant

services:
  app:
    <<: *app
    command: ["all"]
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      zitadel-setup:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *app-environment
      WA_OWNER_DATABASE_URL: postgres://wa_owner:${WA_OWNER_PASSWORD:?run make up, which writes .env}@postgres:5432/wallet_accountant?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up, which writes .env}
      WA_OWNER_PASSWORD: ${WA_OWNER_PASSWORD:?run make up, which writes .env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./deploy/selfhosted/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.2
    restart: unless-stopped
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?run make up, which writes .env}
      ZITADEL_PORT: ${AUTH_PORT:-8081}
      ZITADEL_EXTERNALDOMAIN: ${AUTH_DOMAIN:-auth.localhost}
      ZITADEL_EXTERNALPORT: ${AUTH_PORT:-8081}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?run make up, which writes .env}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?run make up, which writes .env}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # The bundled v1 login UI, so no separate login container is needed.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?run make up, which writes .env}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # A machine administrator whose token zitadel-setup uses to create the
      # project with a fixed ID. Zitadel writes the token on its first start only.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: wa-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: wa-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-setup/pat.txt
    volumes:
      - zitadel-setup:/zitadel-setup
    ports:
      - "${AUTH_PORT:-8081}:${AUTH_PORT:-8081}"
    networks:
      default:
        # The issuer URL must work from the browser and from the app, so the
        # app resolves AUTH_DOMAIN to this container.
        aliases:
          - ${AUTH_DOMAIN:-auth.localhost}
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-setup-volume:
        condition: service_completed_successfully

  # Zitadel runs as uid 1000 and must be able to write its token to the volume.
  zitadel-setup-volume:
    image: curlimages/curl:8.17.0
    restart: "no"
    user: "0"
    entrypoint: ["chown", "1000:1000", "/zitadel-setup"]
    volumes:
      - zitadel-setup:/zitadel-setup

  # Creates the project with the ID OIDC_AUDIENCE, so the app's audience
  # needs no manual step (deploy/zitadel/setup-project.sh).
  zitadel-setup:
    image: curlimages/curl:8.17.0
    restart: "no"
    user: "1000:1000"
    entrypoint: ["sh", "/setup-project.sh"]
    environment:
      # curl resolves *.localhost to itself, so reach the service by name.
      ZITADEL_URL: http://zitadel:${AUTH_PORT:-8081}
      ZITADEL_HOST: ${AUTH_DOMAIN:-auth.localhost}:${AUTH_PORT:-8081}
      PROJECT_ID: ${OIDC_AUDIENCE:-wallet-accountant}
      PAT_FILE: /zitadel-setup/pat.txt
    volumes:
      - zitadel-setup:/zitadel-setup:ro
      - ./deploy/zitadel/setup-project.sh:/setup-project.sh:ro
    depends_on:
      zitadel:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    # discard.yaml drops every signal; `make up-observability` selects
    # observability.yaml, which forwards to Tempo, Prometheus and Loki.
    command: ["--config=/etc/otelcol/${COLLECTOR_CONFIG:-discard}.yaml"]
    volumes:
      - ./deploy/selfhosted/otelcol:/etc/otelcol:ro

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/selfhosted/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - prometheus:/prometheus

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki:/loki

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make up, which writes .env}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/selfhosted/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
      - loki

volumes:
  postgres:
  zitadel-setup:
  tempo:
  prometheus:
  loki:
  grafana:
