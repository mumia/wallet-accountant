openapi: 3.0.3
info:
  title: Wallet Accountant API
  version: 0.1.0
  description: |
    Wallet Accountant tracks where a Household's money goes and how that
    compares to what it planned. This document is the contract between the
    backend and the frontend (ADR-0008). Every error is returned as
    `application/problem+json` (RFC 9457).
  contact:
    name: Wallet Accountant maintainers
    url: https://github.com/mumia/wallet-accountant
    email: wallet-accountant@users.noreply.github.com
  x-api-id: 0b9c5a2e-6f0e-4d8a-9a51-3f3c2d7e8b41
  x-audience: external-partner
servers:
  - url: /api
    description: |
      The API, on the same origin as the UI (ADR-0021). In development
      (`make run`) that is http://localhost:8080/api.
security:
  - bearer_auth: []
tags:
  - name: Users
    description: The signed-in identity and its registration
  - name: Members
    description: Who belongs to a Household, joining it and leaving it (ADR-0003, ADR-0025)
  - name: Invitations
    description: Invitations to a Household, which admit their redeemer to it (ADR-0025)
  - name: Currencies
    description: Currencies Wallet Accountant knows, with their decimal places (ADR-0007)
  - name: Households
    description: Households, the only ownership and privacy boundary (ADR-0003)
  - name: Categories
    description: What money was received for or spent on (ADR-0004)
  - name: Accounts
    description: Places where money is held or owed (ADR-0004)
  - name: Connections
    description: Links between an Account and an outside source of its transactions
  - name: Transactions
    description: An Account's Transactions as a single-entry list (ADR-0001)
  - name: Statement imports
    description: Uploads of a bank statement file through a Connection (ADR-0018)
  - name: Imported transactions
    description: Rows brought in by Statement imports, waiting for review
  - name: Months
    description: An Account's Booking months, their status and Month close (ADR-0018)
  - name: Notifications
    description: Household-level messages every member sees
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in User
      description: |
        Returns the User the bearer token belongs to, and whether they are
        Instance administrator. An identity that has signed in but not
        redeemed an Invitation is not a User yet and gets 403 with the
        problem type `/problems/registration-required` (ADR-0017).
      tags:
        - Users
      responses:
        '200':
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: changeMe
      summary: Change your display name
      description: |
        Changes the caller's display name, the name other members of their
        Households see. A User who registered before display names existed
        has none until they set one here. A name of only spaces gets 422
        `/problems/invalid-user`, and an empty or too long one 400. Names
        needn't be unique. The same name again records nothing.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeChange'
      responses:
        '200':
          description: The User, renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /registrations:
    post:
      operationId: createRegistration
      summary: Redeem an Invitation
      description: |
        Redeems an Invitation code, making the signed-in identity a User with
        the role the Invitation grants and the display name it gives
        (ADR-0017). An Invitation to a Household also makes the new User a
        member of that Household, in the same step (ADR-0025). An unknown,
        expired, superseded, revoked or already used code gets 422 with one
        generic problem, so codes can't be probed. A display name of only
        spaces gets 422 `/problems/invalid-user`. An identity that is already
        a User gets 409 `/problems/already-registered`, and redeems an
        Invitation to a Household with `createMembership` instead.

        `display_name` is required since `v0.4.0`.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: The new User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /memberships:
    post:
      operationId: createMembership
      summary: Join a Household
      description: |
        Redeems an Invitation to a Household as a User, making them a member
        of that Household (ADR-0025). It answers with the Household joined.
        An unknown, expired, revoked or already used code, and any code that
        names no Household, gets 422 `/problems/invalid-invitation`, one
        generic problem, so codes can't be probed. A User who is already a
        member of the Household gets 409 `/problems/already-a-member`, and
        the code stays unused. An unregistered caller gets 403
        `/problems/registration-required`, and redeems the code with
        `createRegistration` instead.
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreation'
      responses:
        '201':
          description: The Household joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /currencies:
    get:
      operationId: listCurrencies
      summary: The known currencies
      description: |
        Lists every currency Wallet Accountant knows, sorted by code, with
        the number of decimal places its amounts use (ADR-0007). This is
        exactly the set of codes every currency field accepts; any other
        code is refused. Any authenticated identity may call it, registered
        or not.
      tags:
        - Currencies
      responses:
        '200':
          description: The known currencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Problem'
  /households:
    post:
      operationId: createHousehold
      summary: Create a Household
      description: |
        Creates a Household with a name and a Base currency. The caller
        becomes its first member, and its Internal Categories (Opening
        balance, Household transfer, Uncategorised) are created with it.
        An unregistered caller gets 403 with the problem type
        `/problems/registration-required`.
      tags:
        - Households
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreation'
      responses:
        '201':
          description: The new Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listHouseholds
      summary: The caller's Households
      description: |
        Lists the Households the caller is a member of. An unregistered
        caller gets 403 with the problem type `/problems/registration-required`.
      tags:
        - Households
      responses:
        '200':
          description: The caller's Households
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}:
    get:
      operationId: getHousehold
      summary: A Household
      description: |
        Returns a Household the caller is a member of. Any other Household,
        and every Household for an unregistered caller, is 404: a 403 would
        confirm that it exists.
      tags:
        - Households
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/members:
    get:
      operationId: listMembers
      summary: The Household's members
      description: |
        Lists every member of the Household, oldest first, with their
        display name and when they joined. Every member is equal and sees
        everything in the Household (ADR-0003).
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/members/{user_id}:
    delete:
      operationId: removeMember
      summary: Remove a member, or leave
      description: |
        Removes the member from the Household. With the caller's own User ID
        the caller leaves. Any member may remove any other (ADR-0025). The
        removed User loses access at once but stays a User, and can rejoin
        only through a new Invitation. The Household's only member gets 409
        `/problems/last-member`. A User who isn't a member gets 404.
      tags:
        - Members
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: The member was removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/invitations:
    post:
      operationId: createInvitation
      summary: Invite someone to the Household
      description: |
        Issues an Invitation to the Household (ADR-0025). Whoever redeems
        its code becomes a member: someone unregistered with
        `createRegistration`, which also makes them a User, and a User with
        `createMembership`. The code is single-use, expires 24 hours after
        it is issued, and is returned only in this response, never in a
        list. A replay with the same Idempotency-Key returns the same code.
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new Invitation, with its code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listInvitations
      summary: The Household's open Invitations
      description: |
        Lists the Household's open Invitations, oldest first: those not
        redeemed, not revoked and not expired. It never returns a code.
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The open Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an Invitation
      description: |
        Revokes an open Invitation of the Household, whichever member issued
        it. Its code then gets the same 422 as any invalid code. An
        Invitation that isn't open (redeemed, revoked or expired) gets 404.
      tags:
        - Invitations
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/InvitationID'
      responses:
        '204':
          description: The Invitation was revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/categories:
    post:
      operationId: createCategory
      summary: Create a Category
      description: |
        Creates an Income or Expense Category, at the root or under
        `parent_id`. A sub-Category takes its parent's kind, so `kind` may be
        left out; a different kind is refused. Internal Categories belong to
        the system: creating one, or a Category under one, gets 422 with the
        problem type `/problems/internal-category`. A name already used by a
        sibling (ignoring case and surrounding spaces) gets 409 with the
        problem type `/problems/category-name-taken`. Any other refusal is
        422 with the problem type `/problems/invalid-category`.
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreation'
      responses:
        '201':
          description: The new Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listCategories
      summary: The Household's Category tree
      description: |
        Lists every Category of the Household as a tree, Internal Categories
        included: the root Categories, each with its sub-Categories in
        `children`. Siblings are sorted by name.
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's Category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/categories/{category_id}:
    patch:
      operationId: changeCategory
      summary: Rename or move a Category
      description: |
        Renames the Category when `name` is given, and moves it when
        `parent_id` is given: under that Category, or to the root when it is
        `null`. A Category keeps its kind, so it can only move under a parent
        of the same kind, and never under itself or one of its
        sub-Categories. Internal Categories can't be renamed or moved, and
        nothing can be moved under one (422, `/problems/internal-category`).
        A name already used by a sibling in the place the Category ends up
        gets 409 (`/problems/category-name-taken`); any other refusal is 422
        (`/problems/invalid-category`).
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/CategoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryChange'
      responses:
        '200':
          description: The Category as changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts:
    post:
      operationId: addAccount
      summary: Add an Account
      description: |
        Adds an Account with a name, a kind, an Account currency and a start
        date. A statement Account (any kind but `CASH`) awaits its first
        Statement import and has no balance: its Opening balance is worked
        out from that import, never typed (ADR-0018). A cash Account is kept
        entirely by hand: it takes `opening_count`, the cash counted on the
        start date, and `opening_count_confirmation`, the same count typed
        again. Its Opening balance is recorded from the count at once, so it
        never awaits a Statement import and has a balance from the start. Two
        counts that differ get 422 `/problems/opening-count-mismatch`. An
        unknown kind, an unknown currency, a blank name, a cash Account
        without both counts, a count in another currency than the Account's
        or with more decimal places than it has, or a count sent for any
        other kind gets 422 with the problem type `/problems/invalid-account`.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreation'
      responses:
        '201':
          description: The new Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listAccounts
      summary: The Household's Accounts
      description: Lists every Account of the Household, in the order they were added.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's Accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}:
    get:
      operationId: getAccount
      summary: An Account
      description: |
        Returns an Account of the Household with its current balance, or
        that it is awaiting its first Statement import.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: The Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: changeAccount
      summary: Rename an Account
      description: |
        Renames the Account. Only its name can change; its kind, Account
        currency and start date are fixed. A name of only spaces gets 422
        `/problems/invalid-account`, and an empty or too long one 400. Names needn't be unique. The
        same name again records nothing.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountChange'
      responses:
        '200':
          description: The renamed Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/opening-count:
    post:
      operationId: recountOpening
      summary: Correct a cash Account's Opening count
      description: |
        Replaces a cash Account's Opening count while its start date's month
        is still the Account's open month (ADR-0018). The Opening balance
        Transaction is reversed, linked to its reversal, and a new one is
        recorded on the start date from the new count, typed twice. The same
        count again records nothing. Two counts that differ get 422
        `/problems/opening-count-mismatch`; a count in another currency or
        with more decimal places than the Account's gets 422
        `/problems/invalid-account`; an Account that isn't cash gets 422
        `/problems/not-a-cash-account`; and once the start month has closed,
        409 `/problems/opening-count-locked`.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningRecount'
      responses:
        '200':
          description: The Account with its new balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/connections:
    post:
      operationId: createConnection
      summary: Create a Connection for an Account
      description: |
        Creates a statement file import Connection for the Account, with a
        name and optionally the CSV mapping of the bank's statement files.
        The name is trimmed, 1 to 100 characters, and unique within the
        Account ignoring case: a name already used gets 422
        `/problems/connection-name-taken`. Live bank feeds are not supported
        yet; a `BANK_FEED` or unknown kind, or a name of only spaces, gets
        422 with the problem type `/problems/invalid-connection`; an empty or
        too long name gets 400. An invalid
        mapping gets 422 with `/problems/invalid-csv-mapping`, and nothing is
        created. A cash Account is kept by hand and takes no Connection: it
        gets 422 `/problems/invalid-connection`.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreation'
      responses:
        '201':
          description: The new Connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listConnections
      summary: An Account's Connections
      description: Lists every Connection of the Account, in the order they were created.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: The Account's Connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/connections/{connection_id}:
    patch:
      operationId: changeConnection
      summary: Rename a Connection
      description: |
        Renames the Connection. The name is trimmed, 1 to 100 characters,
        and unique within the Account ignoring case: a name already used by
        another of its Connections gets 422 `/problems/connection-name-taken`,
        one of only spaces 422 `/problems/invalid-connection`, and an empty
        or too long one 400. The
        same name again records nothing. The CSV mapping is saved apart, by
        `saveCsvMapping`.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/ConnectionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionChange'
      responses:
        '200':
          description: The renamed Connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/connections/{connection_id}/csv-mapping:
    put:
      operationId: saveCsvMapping
      summary: Save a Connection's CSV mapping
      description: |
        Replaces the Connection's CSV mapping. The mapping is validated as a
        whole: a missing required field, an unknown date format, the same
        column used twice or any other problem gets 422 with the problem type
        `/problems/invalid-csv-mapping`, whose detail lists every problem.
        Every save gives the mapping a new `csv_mapping_version`.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/ConnectionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvMapping'
      responses:
        '200':
          description: The Connection with its new mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/csv-mapping-tests:
    post:
      operationId: testCsvMapping
      summary: Test an unsaved CSV mapping on a sample file
      description: |
        Reads a sample statement file with an unsaved CSV mapping, exactly as
        an upload would read it, and returns the first 10 readable rows, how
        many rows are readable, and every unreadable line with its reason.
        Amounts are read in the Account currency. Rows before the Account's
        start date are shown too: this tests the mapping, not an import. It
        records nothing and doesn't keep the sample. An invalid mapping gets
        422 `/problems/invalid-csv-mapping`, whose detail lists every
        problem, and a file with no rows at all 422
        `/problems/empty-statement-file`.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvMappingTestUpload'
            encoding:
              csv_mapping:
                contentType: application/json
      responses:
        '200':
          description: The sample as the mapping reads it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvMappingTest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/transactions:
    get:
      operationId: listAccountTransactions
      summary: An Account's Transactions
      description: |
        Lists the Account's Transactions as a single-entry list (ADR-0001):
        each with its signed amount on this Account (positive is money in),
        Booking date, Transaction date, description and Category. Sorted by
        Booking date, then in the order they were recorded, and paged with a
        cursor. `booking_month` keeps only one Booking month, and
        `in_transit=true` only the Transfer legs that are In transit: not
        Matched and not reversed. The list is always current: it is read in
        the request's own transaction.
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/BookingMonth'
        - name: in_transit
          in: query
          required: false
          description: When true, only the Account's Transfer legs that are In transit
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the Account's Transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: recordCashTransaction
      summary: Record a cash Transaction
      description: |
        Records a Transaction on a cash Account, which is kept entirely by
        hand. `date` is both its Booking date and its Transaction date, and
        `amount` is signed (positive is money in), in the Account currency.
        The other side is `category_id`, with the Category rules of Accept
        (absent, or the Uncategorised Category, leaves it in Uncategorised;
        any other Internal Category gets 422 `/problems/internal-category`;
        a Category that isn't one of the Household's 422
        `/problems/invalid-category`; an Expense Category on money in, or
        an Income Category on money out, 422 `/problems/category-direction`,
        naming `category_id`, `category_kind` and the amount's
        `direction`), or `counterpart_account_id`, which
        makes it a Transfer leg against the Account transfer Category. A
        leg whose counterpart is a statement Account stays In transit until
        that Account's row is Accepted as a Transfer and Matched to it. A
        leg whose counterpart is another cash Account records that
        Account's leg too, with the opposite amount and the same date,
        description and payee, and confirms the Match between them: the
        response is this Account's leg, with its `match_id`. Both
        `category_id` and `counterpart_account_id`, a counterpart that is
        the Account itself, isn't one of the Household's, or has another
        Account currency get 422 `/problems/invalid-transfer` with a
        `reason`. An Account that isn't cash gets 422
        `/problems/not-a-cash-account`: statement Accounts take
        Transactions only from their statements. A zero amount, one in
        another currency or with more decimal places than the Account's, a
        date after today (UTC) or before the Account's start date gets 422
        `/problems/invalid-transaction`. A date in a closed month of either
        Account gets 409 `/problems/month-closed`, naming the Account in
        `account_id`; months after the open month are fine for a cash
        Account (ADR-0024).
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashTransactionCreation'
      responses:
        '201':
          description: The recorded Transaction, on this Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        '422':
          $ref: '#/components/responses/TransferRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/imported-transactions:
    get:
      operationId: listImportedTransactions
      summary: An Account's Imported transactions
      description: |
        Lists the Account's Imported transactions, sorted by Booking date and
        then in the order they were imported (a file's rows in line order),
        paged with a cursor.
        `state` keeps only those in one state (`PENDING`: waiting for
        review; `SUSPECTED_DUPLICATE`: only looks like an earlier Imported
        transaction, shown in `resembles`, and waits to be kept or
        Discarded; `ACCEPTED`: booked in the Ledger; `DISCARDED`: never to
        reach the Ledger) and `booking_month` only one Booking month.
      tags:
        - Imported transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - name: state
          in: query
          required: false
          description: Only Imported transactions in this state
          schema:
            type: string
            x-extensible-enum:
              - PENDING
              - SUSPECTED_DUPLICATE
              - ACCEPTED
              - DISCARDED
            example: PENDING
        - $ref: '#/components/parameters/BookingMonth'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the Account's Imported transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedTransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/months:
    get:
      operationId: listAccountMonths
      summary: An Account's months
      description: |
        Returns every Booking month of the Account, newest first and
        unpaged, each as on `getAccountMonth`. The months run from the start
        date's month to the later of the current calendar month (UTC) and
        the latest Booking month holding a non-Discarded Imported
        transaction. The Account has exactly one `OPEN` month; the months
        before it are `CLOSED` and those after it `NOT_OPEN_YET` (ADR-0024).
        It answers from the Account's creation: before its first Statement
        import, the start date's month is `OPEN` and the rest are
        `NOT_OPEN_YET`. It is always current: it is read in the request's own
        transaction.
      tags:
        - Months
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: The Account's months, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMonthList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/months/{booking_month}:
    get:
      operationId: getAccountMonth
      summary: An Account's month status
      description: |
        Returns one Booking month of the Account (months are decided by
        Booking date): whether it is `CLOSED`, the Account's one `OPEN`
        month, or `NOT_OPEN_YET` (ADR-0024); the Statement balance it closed
        with; the computed closing balance (the Opening balance plus every
        month up to this one; absent while the Account awaits its first
        Statement import); how many of its Imported transactions are pending
        or undecided Suspected duplicates; how many of its Transactions are
        in Uncategorised; the Statement imports whose Balance check stops it
        closing; and whether it can be reopened now. Any month from the start
        date's month on can be read, a later one as `NOT_OPEN_YET`; a month
        before the start date's month gets 404. It is always current: it is
        read in the request's own transaction.
      tags:
        - Months
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/BookingMonthPath'
      responses:
        '200':
          description: The month's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMonth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/months/{booking_month}/close:
    post:
      operationId: closeAccountMonth
      summary: Close an Account's month
      description: |
        Closes the Account's open month with the Statement balance, the
        closing balance on the bank statement, and opens the month after it
        (December rolls into January). Months close one at a time, in order
        (ADR-0024). Only the open month can close: a month that isn't open
        yet gets 409 `/problems/month-not-open-yet`, naming the
        `booking_month` and the Account's `open_month`, and the open month
        gets 409 `/problems/month-not-ended` until it has ended, by the
        server's clock in UTC. The close is refused with 422
        `/problems/month-close-refused`, listing every failed condition in
        `reasons` at once, while any Imported transaction booked in the month
        is pending or an undecided Suspected duplicate, any Transaction booked
        in it is in Uncategorised, a Statement import with rows in or before
        the month has its Balance check waiting or failed (voided imports
        don't count), or the computed closing balance differs from the
        Statement balance (both amounts and the difference are given). Nothing
        is ever booked to make the balances meet: a gap is closed by
        correcting the entry that is wrong (ADR-0018). A cash Account's month
        closes by a Cash count instead: `statement_balance` is the amount
        counted and `counted_on` the day it was counted, after the month's
        last day and no later than today (UTC); otherwise 422
        `/problems/invalid-count-date`. The count is compared with the
        Opening balance plus every Transaction booked up to the end of
        `counted_on` (a gap gives that `computed_balance`, the count as
        `statement_balance` and the `difference`: record what really
        happened, such as a loss against an Expense Category). The month-end
        balance the count proves is stored as the month's Statement balance.
        `counted_on` is required for a cash Account and refused with 400
        `/problems/invalid-month-closing` for any other. A month already closed
        gets 409 `/problems/month-already-closed`, and an Account awaiting its
        first Statement import 409
        `/problems/account-awaiting-first-statement-import`. A Statement
        balance in another currency than the Account's, or with more decimal
        places than it has, or a month before the Account's start date gets
        422 `/problems/invalid-month-close`.
      tags:
        - Months
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/BookingMonthPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthClosing'
      responses:
        '200':
          description: The closed month's status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMonth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        '422':
          $ref: '#/components/responses/MonthCloseRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}/months/{booking_month}/reopen:
    post:
      operationId: reopenAccountMonth
      summary: Reopen an Account's latest closed month
      description: |
        Takes back the Account's latest Month close (ADR-0024). The month
        becomes the open month again, its Statement balance is dropped, and
        the month after it goes back to `NOT_OPEN_YET`: the month must be
        closed again with its Statement balance. Reopen is refused with 409
        `/problems/month-reopen-refused`, listing every failed condition in
        `reasons` at once: the month isn't closed (`NOT_CLOSED`), it isn't
        the Account's latest closed month (`NOT_LATEST_CLOSED`), or the open
        month has Accepted Transactions that aren't reversed
        (`OPEN_MONTH_HAS_ACCEPTED_TRANSACTIONS`, with the `open_month` and
        the `accepted` count): reverse them first. A cash Account has no
        Accepted Transactions, so that condition never applies to it: its
        later months' Transactions stay, and the month must be closed again
        with a new Cash count. Retrying with the same
        Idempotency-Key returns the original result.
      tags:
        - Months
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
        - $ref: '#/components/parameters/BookingMonthPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The reopened month's status, now open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMonth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthReopenRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/imported-transactions/{imported_transaction_id}/accept:
    post:
      operationId: acceptImportedTransaction
      summary: Accept a pending Imported transaction
      description: |
        Accepts a pending Imported transaction: a balanced Ledger Transaction
        is recorded in the same transaction, with exactly the row's amount,
        dates, description and payee, between the Account and `category_id`.
        Without `category_id`, or with the Uncategorised Category, the other
        side waits in Uncategorised. The Account's balance and its
        Transaction list reflect it immediately. An Imported transaction
        already Accepted gets 409
        `/problems/imported-transaction-already-accepted`, and a Discarded
        one 409 `/problems/imported-transaction-discarded`; a Suspected
        duplicate, not yet kept, gets 409
        `/problems/imported-transaction-suspected-duplicate`; any other Internal
        Category gets 422 `/problems/internal-category`, and a Category that
        isn't one of the Household's gets 422 `/problems/invalid-category`.
        An Expense Category takes only money out (a negative amount) and an
        Income Category only money in (a positive one); Uncategorised and a
        zero amount take either. A Category of the wrong kind gets 422
        `/problems/category-direction`, naming `category_id`,
        `category_kind` and the amount's `direction`, and nothing is booked.
        A row booked in a closed month gets 409 `/problems/month-closed`, and
        one booked in a month that isn't open yet 409
        `/problems/month-not-open-yet` (ADR-0024); both name the
        `booking_month`, and the second also the Account's `open_month`.

        With `transfer_account_id` instead of `category_id`, the row is
        Accepted as a Transfer to or from that cash Account: the Transaction
        recorded is the row's Transfer leg, against the Account transfer
        Category, and the cash Account gets the opposite leg, dated on the
        row's Transaction date, with its description and payee. The two legs
        are Matched in the same transaction. With `match_transaction_id`, no
        cash leg is recorded: the given leg, one the cash Account already
        has In transit (see `listTransferSuggestions`), is Matched instead.
        A cash leg dated in a closed month of the cash Account gets 409
        `/problems/month-closed`, naming the cash Account in `account_id`.
        Refused Transfers get 422 `/problems/invalid-transfer` with a
        `reason`: both `category_id` and `transfer_account_id`
        (`CATEGORY_AND_TRANSFER`), `match_transaction_id` alone
        (`MATCH_WITHOUT_TRANSFER`), a counterpart that isn't a cash Account
        (`COUNTERPART_NOT_CASH`; Transfers between statement Accounts come
        later), the row's own Account (`SAME_ACCOUNT`), another Account
        currency (`CURRENCY_MISMATCH`), an Account that isn't the
        Household's (`UNKNOWN_ACCOUNT`), or a leg to match that isn't an In
        transit leg on the cash Account naming this row's Account with the
        opposite amount (`NOT_A_MATCHING_LEG`).

        Retrying with the same Idempotency-Key and body returns the original
        result and never books twice.
      tags:
        - Imported transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ImportedTransactionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportedTransactionAcceptance'
      responses:
        '200':
          description: The Accepted Imported transaction, with the Transaction that booked it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        '422':
          $ref: '#/components/responses/TransferRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/imported-transactions/{imported_transaction_id}/transfer-suggestions:
    get:
      operationId: listTransferSuggestions
      summary: Cash legs an Imported transaction could be Matched to
      description: |
        Lists the Transfer legs on the cash Account `account_id` that could
        be the other side of this Imported transaction: not Matched and not
        reversed, naming the row's Account as their counterpart, with the
        opposite amount, and dated within 7 days either side of the row's
        Transaction date. Closest date first. They are worked out on each
        request and never stored; a User confirms one by Accepting the row
        with it as `match_transaction_id`. An `account_id` that isn't a
        cash Account of the Household gets 422 `/problems/invalid-transfer`
        (`COUNTERPART_NOT_CASH` or `UNKNOWN_ACCOUNT`).
      tags:
        - Imported transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ImportedTransactionID'
        - name: account_id
          in: query
          required: true
          description: The cash Account whose legs are suggested
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The suggested legs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/TransferRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/matches/{match_id}:
    get:
      operationId: getMatch
      summary: A Match
      description: |
        Returns a confirmed Match: the two Transfer legs it links, who
        confirmed it and when. A Match removed by reversing one of its legs
        gets 404.
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/MatchID'
      responses:
        '200':
          description: The Match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/transactions/{transaction_id}:
    patch:
      operationId: changeTransaction
      summary: Set a Transaction's Category
      description: |
        Sets the Category on the non-Account side of the Transaction, for
        example to categorise one Accepted into Uncategorised or to correct
        a wrong Category. Its amount never changes. The Account's
        Uncategorised count and Transaction list reflect it immediately. The
        Category rules are Accept's: the Uncategorised Category is allowed,
        any other Internal Category gets 422 `/problems/internal-category`,
        and a Category that isn't one of the Household's gets 422
        `/problems/invalid-category`. A reversed Transaction gets 409
        `/problems/transaction-reversed`; a reversal gets 422
        `/problems/transaction-is-a-reversal`, and the Opening balance
        Transaction 422 `/problems/opening-balance-transaction`. In a closed
        month the Category can still change, but not to Uncategorised: that
        gets 422 `/problems/uncategorised-in-closed-month` (ADR-0024). A
        Transfer leg's other side is always the Account transfer Category:
        it gets 422 `/problems/transfer-leg`. Only then is the Category's
        kind checked against the amount's sign, in closed months too: an
        Expense Category on money in, or an Income Category on money out,
        gets 422 `/problems/category-direction`, naming `category_id`,
        `category_kind` and the amount's `direction`.
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/TransactionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionChange'
      responses:
        '200':
          description: The Transaction with its new Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/TransferRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/transactions/{transaction_id}/reverse:
    post:
      operationId: reverseTransaction
      summary: Reverse a Transaction
      description: |
        Reverses a mistaken Transaction without editing or deleting it
        (ADR-0018): a reversing Transaction is recorded with the opposite
        Postings, the same Booking date and a link to the original, and both
        appear in the Account's Transaction list. Neither counts as
        Uncategorised any more. When an Accept recorded the Transaction, its
        Imported transaction goes back to pending in the same transaction,
        to be Accepted again or Discarded. A Transaction already reversed
        gets 409 `/problems/transaction-already-reversed`; a reversal gets
        422 `/problems/transaction-is-a-reversal`, and the Opening balance
        Transaction 422 `/problems/opening-balance-transaction` (only
        voiding the first Statement import changes it). A Transaction booked
        in a closed month gets 409 `/problems/month-closed`, naming the
        `booking_month`: Reopen back to it first (ADR-0024).

        Reversing a Matched Transfer leg removes its Match. When the leg is
        an Accepted row's, a cash leg recorded automatically by that Accept
        is reversed with it; a cash leg entered by hand stays, In transit,
        to be Matched again. Reversing a cash leg alone leaves the other leg
        In transit. Reversing either leg of a Transfer between two cash
        Accounts reverses both. When any Transaction it would reverse is
        booked in a closed month of its Account, nothing is reversed: 409
        `/problems/month-closed`, naming that Account in `account_id`.
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/TransactionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The reversing Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/imported-transactions/{imported_transaction_id}/keep:
    post:
      operationId: keepImportedTransaction
      summary: Keep a Suspected duplicate
      description: |
        Keeps a Suspected duplicate as a real transaction: it becomes
        pending, to be Accepted or Discarded like any other row, and still
        shows what it resembled. Deciding the last Suspected duplicate of a
        Statement import runs its waiting Balance check, recorded as passed
        or failed. An Imported transaction that isn't a Suspected duplicate
        gets 409 `/problems/imported-transaction-not-suspected-duplicate`.
        One booked in a closed month gets 409 `/problems/month-closed`. A
        Suspected duplicate booked in a month that isn't open yet can still
        be kept, so its Statement import's Balance check never waits on a
        month that can't open (ADR-0024).
      tags:
        - Imported transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ImportedTransactionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The kept Imported transaction, now pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/imported-transactions/{imported_transaction_id}/discard:
    post:
      operationId: discardImportedTransaction
      summary: Discard a pending Imported transaction or a Suspected duplicate
      description: |
        Discards a pending Imported transaction, for example one whose
        Transaction was reversed, or a Suspected duplicate confirmed as a
        repeat, so it never reaches the Ledger. Discarded is final: it
        doesn't count in later Balance checks. Deciding the last Suspected
        duplicate of a Statement import runs its waiting Balance check. One already
        Discarded gets 409 `/problems/imported-transaction-already-discarded`,
        and an Accepted one 409 `/problems/imported-transaction-already-accepted`
        (reverse its Transaction first). One booked in a closed month gets 409
        `/problems/month-closed`. A pending row booked in a month that isn't
        open yet gets 409 `/problems/month-not-open-yet`, but a Suspected
        duplicate there can still be Discarded (ADR-0024). Both problems name
        the `booking_month`, and the second also the Account's `open_month`.
      tags:
        - Imported transactions
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ImportedTransactionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Discarded Imported transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/connections/{connection_id}/statement-imports/previews:
    post:
      operationId: previewStatementImport
      summary: Preview an Account's first Statement import
      description: |
        Reads a statement file with the Connection's CSV mapping and shows
        the Opening balance the Account's first Statement import would
        record (ADR-0018): the Export balance minus the total of the rows
        booked on or after the start date. Records nothing. Without a balance
        column in the Connection's CSV mapping, the Export balance is typed
        twice; entries that differ, or a missing
        `export_balance_confirmation`, get 422
        `/problems/export-balance-mismatch`. With a balance column, the
        file's balance tests the Export balance instead, so the confirmation
        is ignored (see below). A file with an unreadable row is
        refused whole with 422 `/problems/unreadable-statement-file`, listing
        every line and its reason. A file already imported through the
        Connection gets 409 `/problems/duplicate-statement-import`, naming
        the earlier import; an Account that already has its Opening balance
        gets 409 `/problems/opening-balance-already-recorded`. Confirm the
        import by uploading the same file and Export balance with the
        returned `preview_id`.

        Every amount is in the Account currency and may have no more decimal
        places than it has: an Export balance with more gets 422
        `/problems/invalid-export-balance`, and a row with more is an
        unreadable row. A file with no rows at all gets 422
        `/problems/empty-statement-file`, and a Connection without a CSV
        mapping gets 422 `/problems/csv-mapping-required`.

        Through a CSV mapping with a balance column, the Export balance must
        be the file's balance: the balance on its newest row, told by the
        balance column alone and counting every readable row, those before
        the start date included. One that isn't gets 422
        `/problems/export-balance-differs-from-file`, giving the
        `file_balance` and its `line`; a file whose balance column doesn't
        add up from one end to the other gets 422
        `/problems/file-balance-unknown`, giving the reason. Both come after
        the file is read (unreadable rows first) and before the
        duplicate-file check.
      tags:
        - Statement imports
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatementImportPreviewUpload'
      responses:
        '200':
          description: What the first Statement import would record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StatementImportConflict'
        '422':
          $ref: '#/components/responses/StatementFileRefused'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/connections/{connection_id}/statement-imports:
    post:
      operationId: uploadStatementImport
      summary: Upload a statement file
      description: |
        Imports a statement file through the Connection: every row booked on
        or after the Account's start date becomes a pending Imported
        transaction, and the rows before it are ignored and counted
        (`rows_ignored_before_start_date`). Rows booked in a closed month are
        ignored too, before any other test, and counted
        (`rows_ignored_in_closed_months`). Rows booked in a month that isn't
        open yet become pending Imported transactions that can't be Accepted
        or Discarded until their month opens (ADR-0024). The
        first import of an Account needs the `preview_id` of its preview
        (422 `/problems/preview-required` without it). It is recomputed from
        the uploaded file, its Export balance and the Connection's current
        mapping version, and a difference gets 422
        `/problems/preview-mismatch`. The first import also records the
        Opening balance Transaction on the start date, in the same
        transaction; an Account that got its Opening balance since the
        preview gets 409 `/problems/opening-balance-already-recorded`. A file
        with an unreadable row is refused whole (422
        `/problems/unreadable-statement-file`), and a file already imported
        through the Connection gets 409 `/problems/duplicate-statement-import`.

        A later import takes its Export balance once and no `preview_id`
        (409 `/problems/opening-balance-already-recorded` with one). A row
        whose bank transaction ID, Booking date and amount all equal those of
        an earlier Imported transaction of the Account is skipped as a
        certain repeat and counted. The import then runs its Balance check
        (ADR-0018): the Account's Opening balance plus every non-Discarded
        Imported transaction, the new rows included, must equal the Export
        balance. Rows ignored in closed months count only through the
        Imported transactions already recorded. Otherwise the whole import
        is refused with 422 `/problems/balance-check-failed`, giving the
        expected balance, the Export balance and the difference, and nothing
        is recorded. When some of the rows ignored in closed months are
        neither certain repeats nor look like an earlier Imported
        transaction, the problem also gives
        `rows_in_closed_months_not_in_books`, and its `detail` names the
        closed months to Reopen before importing again. Amounts, an empty
        file and a Connection without a mapping are refused as by the
        preview.

        Through a CSV mapping with a balance column, every import, first or
        later, checks its Export balance against the file's balance as the
        preview does (422 `/problems/export-balance-differs-from-file` or
        `/problems/file-balance-unknown`), after the file is read and before
        the duplicate-file check, the Opening balance and the Balance check;
        nothing is recorded. Retrying with the same Idempotency-Key and the same file and
        fields returns the original result, however the form is rebuilt.
      tags:
        - Statement imports
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatementImportUpload'
      responses:
        '201':
          description: The recorded Statement import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StatementImportConflict'
        '422':
          $ref: '#/components/responses/StatementFileRefused'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listStatementImports
      summary: A Connection's Statement imports
      description: Lists every Statement import of the Connection, in the order they were recorded.
      tags:
        - Statement imports
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ConnectionID'
      responses:
        '200':
          description: The Connection's Statement imports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/connections/{connection_id}/statement-imports/{statement_import_id}/void:
    post:
      operationId: voidStatementImport
      summary: Void a Statement import
      description: |
        Withdraws the Account's latest Statement import so that a corrected
        file, or the same file with a fixed mapping, can be uploaded again
        (ADR-0018). Every Imported transaction of the import becomes
        Discarded and its file can be imported again. Voiding the Account's
        only import also reverses its Opening balance Transaction, in the
        same transaction, and the Account awaits its first Statement import
        again: that is the only way to change an Opening balance. Only the
        Account's latest non-voided import can be voided (409
        `/problems/not-the-latest-statement-import`), only while none of its
        rows are Accepted (409 `/problems/statement-import-has-accepted-rows`:
        reverse their Transactions first), only while it doesn't touch a
        closed month (409 `/problems/statement-import-touches-closed-month`,
        naming the earliest such `booking_month`: Reopen back to it first),
        and only once (409 `/problems/statement-import-already-voided`). An
        import touches a closed month when any Imported transaction it
        recorded, in any state, is booked in one, or when it is the Account's
        first import and the start date's month is closed (ADR-0024). Rows it
        ignored don't count. `void_blocked_by` on the Statement import says
        beforehand which of these refusals apply.
      tags:
        - Statement imports
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/ConnectionID'
        - $ref: '#/components/parameters/StatementImportID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The voided Statement import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MonthConflict'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/notifications:
    get:
      operationId: listNotifications
      summary: The Household's Notifications
      description: |
        Lists every Notification of the Household, newest first, with
        whether the caller has marked it read. Notifications are raised a
        little after what caused them, by a deferred handler (ADR-0013): a
        Statement import with Suspected duplicates raises a
        `SUSPECTED_DUPLICATES_FOUND` one linking to the import, and someone
        joining, leaving or being removed raises a `MEMBER_JOINED`,
        `MEMBER_LEFT` or `MEMBER_REMOVED` one naming them.
      tags:
        - Notifications
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's Notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/notifications/{notification_id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark a Notification read
      description: |
        Marks the Notification read for the caller only; every other member
        still sees it unread until they mark it read too. Marking it read
        again changes nothing.
      tags:
        - Notifications
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/NotificationID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The Notification, read by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A key the client chooses for one request, such as a UUID. Sending the
        request again with the same key and body returns the stored response
        without repeating it; the same key with a different body gets 422.
        Keys are scoped to the caller.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    HouseholdID:
      name: household_id
      in: path
      required: true
      description: The Household's ID
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      description: The User's ID
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitation_id
      in: path
      required: true
      description: The Invitation's ID
      schema:
        type: string
        format: uuid
    CategoryID:
      name: category_id
      in: path
      required: true
      description: The Category's ID
      schema:
        type: string
        format: uuid
    AccountID:
      name: account_id
      in: path
      required: true
      description: The Account's ID
      schema:
        type: string
        format: uuid
    ConnectionID:
      name: connection_id
      in: path
      required: true
      description: The Connection's ID
      schema:
        type: string
        format: uuid
    StatementImportID:
      name: statement_import_id
      in: path
      required: true
      description: The Statement import's ID
      schema:
        type: string
        format: uuid
    NotificationID:
      name: notification_id
      in: path
      required: true
      description: The Notification's ID
      schema:
        type: string
        format: uuid
    ImportedTransactionID:
      name: imported_transaction_id
      in: path
      required: true
      description: The Imported transaction's ID
      schema:
        type: string
        format: uuid
    TransactionID:
      name: transaction_id
      in: path
      required: true
      description: The Transaction's ID
      schema:
        type: string
        format: uuid
    MatchID:
      name: match_id
      in: path
      required: true
      description: The Match's ID
      schema:
        type: string
        format: uuid
    BookingMonth:
      name: booking_month
      in: query
      required: false
      description: Only this Booking month, written YYYY-MM
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        example: 2026-01
    BookingMonthPath:
      name: booking_month
      in: path
      required: true
      description: The Booking month, written YYYY-MM
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        example: 2026-01
    Cursor:
      name: cursor
      in: query
      required: false
      description: Where the page starts, the `next_cursor` of the previous page; absent for the first page
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: The most items a page holds
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An OpenID Connect access token issued by the instance's provider (ADR-0010)
  responses:
    Unauthorized:
      description: The bearer token is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller may not do this, for example because it is not registered yet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state, for example the caller is already registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request is well-formed but can't be carried out, for example an invalid Invitation code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource doesn't exist, or the caller may not know it does
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed, for example an invalid cursor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StatementImportConflict:
      description: |
        The statement file was already imported through the Connection
        (`statement_import_id` names the earlier import), or the Account
        already has its Opening balance
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatementImportConflictProblem'
    StatementFileRefused:
      description: |
        The statement file or its Export balance is refused; for unreadable
        rows, `rows` lists every line and its reason
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StatementFileProblem'
    MonthCloseRefused:
      description: |
        The month can't close yet (`reasons` lists every failed condition),
        or the request can't be carried out
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MonthCloseProblem'
    MonthConflict:
      description: |
        The request conflicts with the current state: for example the row is
        booked in a closed month, or in a month that isn't open yet
        (`booking_month` and the Account's `open_month` given)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MonthProblem'
    TransferRefused:
      description: |
        The request is well-formed but can't be carried out; a refused
        Transfer (`/problems/invalid-transfer`) says why in `reason`, and a
        Category of the wrong kind for the amount's sign
        (`/problems/category-direction`) names it with its kind and the
        amount's direction
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TransferProblem'
    MonthReopenRefused:
      description: The month can't be reopened (`reasons` lists every failed condition)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MonthReopenProblem'
    Problem:
      description: An error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Me:
      type: object
      description: The signed-in User
      required:
        - user_id
        - is_instance_administrator
      properties:
        user_id:
          type: string
          format: uuid
          description: The User's ID (UUIDv7)
        is_instance_administrator:
          type: boolean
          description: Whether the User controls who is admitted to the instance
        display_name:
          $ref: '#/components/schemas/DisplayNameOut'
    DisplayName:
      type: string
      minLength: 1
      maxLength: 64
      description: The name other members see, trimmed; not blank, and needn't be unique
      example: Ana
    DisplayNameOut:
      type: string
      description: The User's display name; absent for a User who registered before display names existed and hasn't set one
      example: Ana
    MeChange:
      type: object
      description: A new display name for the caller
      required:
        - display_name
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
    Registration:
      type: object
      description: An Invitation code to redeem, and the new User's display name
      required:
        - invitation_code
        - display_name
      properties:
        invitation_code:
          $ref: '#/components/schemas/InvitationCode'
        display_name:
          $ref: '#/components/schemas/DisplayName'
    InvitationCode:
      type: string
      minLength: 1
      maxLength: 256
      description: The Invitation code, exactly as it was handed out
    MembershipCreation:
      type: object
      description: An Invitation code to a Household, redeemed by a User
      required:
        - invitation_code
      properties:
        invitation_code:
          $ref: '#/components/schemas/InvitationCode'
    Member:
      type: object
      description: A member of a Household
      required:
        - user_id
        - joined_at
      properties:
        user_id:
          type: string
          format: uuid
          description: The member's User ID
        display_name:
          $ref: '#/components/schemas/DisplayNameOut'
        joined_at:
          type: string
          format: date-time
          description: When they became a member, by creating the Household or redeeming an Invitation
          example: '2026-11-23T10:00:00Z'
    MemberList:
      type: object
      description: A Household's members
      required:
        - items
      properties:
        items:
          type: array
          description: The members, oldest first
          items:
            $ref: '#/components/schemas/Member'
    UserRef:
      type: object
      description: A User, with their display name, who may no longer be a member
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: The User's ID
        display_name:
          $ref: '#/components/schemas/DisplayNameOut'
    IssuedInvitation:
      type: object
      description: A new Invitation to a Household, with the code only this response carries
      required:
        - invitation_id
        - code
        - expires_at
      properties:
        invitation_id:
          type: string
          format: uuid
          description: The Invitation's ID (UUIDv7)
        code:
          type: string
          description: The code to hand to the person invited; shown only here
          example: 3q2-7wEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        expires_at:
          type: string
          format: date-time
          description: When the code stops working, 24 hours after it was issued
          example: '2026-11-24T10:00:00Z'
    Invitation:
      type: object
      description: An open Invitation to a Household, without its code
      required:
        - invitation_id
        - issued_by
        - issued_at
        - expires_at
      properties:
        invitation_id:
          type: string
          format: uuid
          description: The Invitation's ID (UUIDv7)
        issued_by:
          $ref: '#/components/schemas/UserRef'
        issued_at:
          type: string
          format: date-time
          description: When it was issued
          example: '2026-11-23T10:00:00Z'
        expires_at:
          type: string
          format: date-time
          description: When its code stops working
          example: '2026-11-24T10:00:00Z'
    InvitationList:
      type: object
      description: A Household's open Invitations
      required:
        - items
      properties:
        items:
          type: array
          description: The open Invitations, oldest first
          items:
            $ref: '#/components/schemas/Invitation'
    HouseholdCreation:
      type: object
      description: A new Household
      required:
        - name
        - base_currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The Household's name
          example: Home
        base_currency:
          $ref: '#/components/schemas/CurrencyCode'
    Household:
      type: object
      description: A Household
      required:
        - household_id
        - name
        - base_currency
      properties:
        household_id:
          type: string
          format: uuid
          description: The Household's ID (UUIDv7)
        name:
          type: string
          description: The Household's name
          example: Home
        base_currency:
          $ref: '#/components/schemas/CurrencyCode'
    HouseholdList:
      type: object
      description: The caller's Households
      required:
        - items
      properties:
        items:
          type: array
          description: The Households, in the order they were created
          items:
            $ref: '#/components/schemas/Household'
    Category:
      type: object
      description: A Category
      required:
        - category_id
        - name
        - kind
      properties:
        category_id:
          type: string
          format: uuid
          description: The Category's ID (UUIDv7)
        name:
          type: string
          description: The Category's name
          example: Uncategorised
        kind:
          type: string
          description: What the Category is for; Internal Categories belong to the system
          x-extensible-enum:
            - INCOME
            - EXPENSE
            - INTERNAL
          example: INTERNAL
        parent_id:
          type: string
          format: uuid
          description: The parent Category's ID; absent for a root Category
    CategoryNode:
      type: object
      description: A Category in the Household's Category tree, with its sub-Categories
      required:
        - category_id
        - name
        - kind
      properties:
        category_id:
          type: string
          format: uuid
          description: The Category's ID (UUIDv7)
        name:
          type: string
          description: The Category's name
          example: Eating out
        kind:
          type: string
          description: What the Category is for; Internal Categories belong to the system
          x-extensible-enum:
            - INCOME
            - EXPENSE
            - INTERNAL
          example: EXPENSE
        parent_id:
          type: string
          format: uuid
          description: The parent Category's ID; absent for a root Category
        children:
          type: array
          description: The sub-Categories, sorted by name; absent when there are none
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryTree:
      type: object
      description: A Household's Categories as a tree
      required:
        - items
      properties:
        items:
          type: array
          description: The root Categories, sorted by name, each with its sub-Categories
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryCreation:
      type: object
      description: A new Category
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The Category's name, unique among its siblings
          example: Coffee
        kind:
          type: string
          description: |
            INCOME or EXPENSE; required for a root Category. A sub-Category
            takes its parent's kind.
          x-extensible-enum:
            - INCOME
            - EXPENSE
          example: EXPENSE
        parent_id:
          type: string
          format: uuid
          description: The Category to create it under; absent for a root Category
    CategoryChange:
      type: object
      description: A change to a Category; a property left out stays as it is
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The new name, unique among its siblings
          example: Espresso
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The Category to move it under, or `null` to make it a root Category
    AccountCreation:
      type: object
      description: |
        A new Account. There is no Opening balance field: a statement
        Account's first Statement import works it out, and a cash Account's
        comes from its Opening count, typed twice (ADR-0018).
      required:
        - name
        - kind
        - currency
        - start_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The Account's name
          example: Main
        kind:
          $ref: '#/components/schemas/AccountKind'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        start_date:
          type: string
          format: date
          description: The day the Account's history begins, and the date of its Opening balance
          example: '2026-01-01'
        opening_count:
          $ref: '#/components/schemas/Money'
        opening_count_confirmation:
          $ref: '#/components/schemas/Money'
    OpeningRecount:
      type: object
      description: A cash Account's new Opening count, typed twice
      required:
        - opening_count
        - opening_count_confirmation
      properties:
        opening_count:
          $ref: '#/components/schemas/Money'
        opening_count_confirmation:
          $ref: '#/components/schemas/Money'
    Account:
      type: object
      description: An Account
      required:
        - account_id
        - name
        - kind
        - currency
        - start_date
        - awaiting_first_statement_import
        - open_month
        - pending
        - suspected_duplicates
      properties:
        account_id:
          type: string
          format: uuid
          description: The Account's ID (UUIDv7)
        name:
          type: string
          description: The Account's name
          example: Main
        kind:
          $ref: '#/components/schemas/AccountKind'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        start_date:
          type: string
          format: date
          description: The day the Account's history begins, and the date of its Opening balance
          example: '2026-01-01'
        awaiting_first_statement_import:
          type: boolean
          description: Whether the Account still awaits the first Statement import that records its Opening balance
        balance:
          $ref: '#/components/schemas/Money'
        open_month:
          type: string
          description: |
            The Account's one open Booking month, written YYYY-MM: the start
            date's month until it closes, then each next month in turn
            (ADR-0024)
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-01
        pending:
          type: integer
          format: int32
          description: The Account's pending Imported transactions, in every month, those not open yet included
          example: 4
        suspected_duplicates:
          type: integer
          format: int32
          description: The Account's undecided Suspected duplicates, in every month, those not open yet included
          example: 1
    AccountChange:
      type: object
      description: A new name for an Account; its kind, Account currency and start date never change
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The Account's new name, trimmed; not blank
          example: Main
    AccountList:
      type: object
      description: A Household's Accounts
      required:
        - items
      properties:
        items:
          type: array
          description: The Accounts, in the order they were added
          items:
            $ref: '#/components/schemas/Account'
    AccountKind:
      type: string
      description: |
        What sort of place the Account is. `CASH` is kept entirely by hand;
        every other kind is a statement Account, which takes Transactions
        only from its statements.
      x-extensible-enum:
        - BANK_ACCOUNT
        - CREDIT_CARD
        - LOAN
        - CRYPTO_WALLET
        - CASH
      example: BANK_ACCOUNT
    ConnectionKind:
      type: string
      description: Where the Connection's transactions come from. `BANK_FEED` is not supported yet and is refused.
      x-extensible-enum:
        - STATEMENT_FILE_IMPORT
      example: STATEMENT_FILE_IMPORT
    ConnectionCreation:
      type: object
      description: A new Connection
      required:
        - name
        - kind
      properties:
        name:
          $ref: '#/components/schemas/ConnectionName'
        kind:
          $ref: '#/components/schemas/ConnectionKind'
        csv_mapping:
          $ref: '#/components/schemas/CsvMapping'
    Connection:
      type: object
      description: A Connection between an Account and a source of its transactions
      required:
        - connection_id
        - account_id
        - name
        - kind
      properties:
        connection_id:
          type: string
          format: uuid
          description: The Connection's ID (UUIDv7)
        name:
          $ref: '#/components/schemas/ConnectionName'
        account_id:
          type: string
          format: uuid
          description: The Account the Connection brings transactions into
        kind:
          $ref: '#/components/schemas/ConnectionKind'
        csv_mapping:
          $ref: '#/components/schemas/CsvMapping'
        csv_mapping_version:
          type: integer
          format: int32
          description: |
            The mapping's version, which changes on every save; absent while
            the Connection has no mapping. A first Statement import's preview
            is tied to it.
          example: 1
    ConnectionName:
      type: string
      minLength: 1
      maxLength: 100
      description: The Connection's name, trimmed, unique within its Account ignoring case
      example: Statement file
    ConnectionChange:
      type: object
      description: A new name for a Connection
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/ConnectionName'
    ConnectionList:
      type: object
      description: An Account's Connections
      required:
        - items
      properties:
        items:
          type: array
          description: The Connections, in the order they were created
          items:
            $ref: '#/components/schemas/Connection'
    CsvMapping:
      type: object
      description: |
        How a bank lays out its statement CSV. Booking date, description and
        the amount (one signed column, or debit and credit columns) are
        required; Transaction date (defaulting to the Booking date), Value
        date, payee and bank transaction ID are optional. Every field is
        validated together when the mapping is saved, so the properties the
        mapping needs are checked there rather than by the schema.
      properties:
        encoding:
          type: string
          description: |
            How the file's bytes are decoded into text, before it is parsed;
            absent means `UTF_8`. A UTF-8 byte order mark is stripped from a
            `UTF_8` or `WINDOWS_1252` file; one that starts with a UTF-16
            byte order mark is unreadable, since it should be read as
            `UTF_16`.

            A `UTF_16` file takes its byte order from its byte order mark
            (`FF FE` little-endian, `FE FF` big-endian), which is stripped;
            a file with no byte order mark is read as little-endian, which is
            what Windows writes. A `UTF_16` file with an odd number of bytes
            is unreadable.
          x-extensible-enum:
            - UTF_8
            - WINDOWS_1252
            - UTF_16
          default: UTF_8
          example: WINDOWS_1252
        delimiter:
          type: string
          description: The one character between columns
          example: ;
        has_header_row:
          type: boolean
          description: Whether the first line after the skipped ones names the columns
          default: false
        skip_leading_lines:
          type: integer
          format: int32
          description: How many lines to skip before the header row or the first row
          default: 0
        skip_trailing_lines:
          type: integer
          format: int32
          description: How many lines to skip at the end of the file, after the last row, such as totals or a closing balance; blank lines at the very end aren't counted
          default: 0
        date_format:
          type: string
          description: How dates are written
          x-extensible-enum:
            - YYYY-MM-DD
            - YYYY/MM/DD
            - YYYYMMDD
            - DD/MM/YYYY
            - DD-MM-YYYY
            - DD.MM.YYYY
            - MM/DD/YYYY
            - MM-DD-YYYY
            - DD/MM/YY
            - MM/DD/YY
          example: DD/MM/YYYY
        decimal_separator:
          type: string
          description: The decimal separator
          x-extensible-enum:
            - .
            - ','
          example: ','
        thousands_separator:
          type: string
          description: The thousands separator, if any; empty for none
          x-extensible-enum:
            - ''
            - .
            - ','
            - ' '
            - "'"
          default: ''
          example: .
        amount_layout:
          type: string
          description: One signed amount column, or separate debit (money out) and credit (money in) columns
          x-extensible-enum:
            - SIGNED
            - DEBIT_CREDIT
          example: SIGNED
        positive_amount_means:
          type: string
          description: For a signed amount, whether a positive amount is money in or money out; some banks invert the sign
          x-extensible-enum:
            - MONEY_IN
            - MONEY_OUT
          example: MONEY_IN
        columns:
          $ref: '#/components/schemas/CsvColumns'
    CsvColumns:
      type: object
      description: |
        Which column holds each field. `balance` is optional: the balance
        after each row, as the bank works it out; it lets every import check
        its Export balance against the file. It is read with the mapping's
        decimal and thousands separators, within the Account currency's
        decimal places, and a row whose balance isn't a number is an
        unreadable row
      properties:
        booking_date:
          $ref: '#/components/schemas/CsvColumn'
        description:
          $ref: '#/components/schemas/CsvColumn'
        amount:
          $ref: '#/components/schemas/CsvColumn'
        debit:
          $ref: '#/components/schemas/CsvColumn'
        credit:
          $ref: '#/components/schemas/CsvColumn'
        transaction_date:
          $ref: '#/components/schemas/CsvColumn'
        value_date:
          $ref: '#/components/schemas/CsvColumn'
        payee:
          $ref: '#/components/schemas/CsvColumn'
        bank_transaction_id:
          $ref: '#/components/schemas/CsvColumn'
        balance:
          $ref: '#/components/schemas/CsvColumn'
    CsvColumn:
      type: object
      description: A column, by its name in the header row or by its position counted from 1; exactly one of the two
      properties:
        header:
          type: string
          description: The column's name in the header row, ignoring case and surrounding spaces
          example: Amount
        position:
          type: integer
          format: int32
          description: The column's position, counted from 1
          example: 3
    CsvMappingTestUpload:
      type: object
      description: |
        An unsaved CSV mapping and a sample statement file to read with it.
        `csv_mapping` is a plain form field holding the mapping as JSON text,
        not a file part
      required:
        - csv_mapping
        - file
      properties:
        csv_mapping:
          $ref: '#/components/schemas/CsvMapping'
        file:
          type: string
          format: binary
          description: The sample statement file, as the bank exported it; it isn't kept
    CsvMappingTest:
      type: object
      description: A sample statement file as an unsaved CSV mapping reads it; nothing is recorded
      required:
        - rows
        - last_rows
        - readable_row_count
        - unreadable_rows
      properties:
        rows:
          type: array
          description: The first 10 readable rows, in file order
          maxItems: 10
          items:
            $ref: '#/components/schemas/ParsedStatementRow'
        last_rows:
          type: array
          description: |
            The last 10 readable rows that aren't already in `rows`, in file
            order, to check how the end of the file reads; empty when the
            file has 10 readable rows or fewer
          maxItems: 10
          items:
            $ref: '#/components/schemas/ParsedStatementRow'
        readable_row_count:
          type: integer
          format: int32
          description: How many rows of the whole file are readable
          example: 42
        unreadable_rows:
          type: array
          description: Every line of the whole file that can't be read, with the reason; empty when all can
          items:
            $ref: '#/components/schemas/RowError'
        file_balance:
          $ref: '#/components/schemas/FileBalance'
        file_balance_problem:
          type: string
          description: |
            Why the file's balance can't be worked out, as an import would
            refuse it. Either this or `file_balance` when the mapping has a
            balance column, neither otherwise
          example: the balance column doesn't add up from one end of the file to the other
    FileBalance:
      type: object
      description: |
        A statement file's balance: the balance on its newest row. The newest
        row is told by the balance column alone: the rows are oldest first
        when the last row's balance is the first row's plus every later
        row's amount, and newest first when the first row's balance is the
        last row's plus every earlier row's amount. Every readable row
        counts, those an import ignores included
      required:
        - amount
        - line
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        line:
          type: integer
          format: int32
          description: The newest row's line in the file, counted from 1, including skipped lines and the header row
          example: 14
    ParsedStatementRow:
      type: object
      description: |
        One statement file row as a CSV mapping reads it; `balance`, the
        balance after the row, is present when the mapping has a balance
        column
      required:
        - line
        - booking_date
        - transaction_date
        - description
        - amount
      properties:
        line:
          type: integer
          format: int32
          description: The line in the file, counted from 1, including skipped lines and the header row
          example: 7
        booking_date:
          type: string
          format: date
          description: The date the bank recorded it on the Account
          example: '2026-01-15'
        transaction_date:
          type: string
          format: date
          description: The date the purchase or payment happened; the Booking date when the file has none
          example: '2026-01-14'
        value_date:
          type: string
          format: date
          description: The date the money moved, when the file has one
          example: '2026-01-16'
        description:
          type: string
          description: The row's description
          example: Coffee
        payee:
          type: string
          description: The payee, when the file has one
        bank_transaction_id:
          type: string
          description: The bank's own ID for the row, when the file has one
        amount:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
    DecimalText:
      type: string
      description: An exact decimal written with `.` as the decimal separator and no thousands separator
      pattern: '^-?[0-9]{1,30}(\.[0-9]{1,18})?$'
      example: '1234.56'
    StatementImportPreviewUpload:
      type: object
      description: |
        A first statement file to preview, with its Export balance.
        `export_balance_confirmation`, the Export balance typed a second
        time, is required when the Connection's CSV mapping has no balance
        column, and ignored when it has one, since the file's balance then
        tests the Export balance
      required:
        - file
        - export_balance
      properties:
        file:
          type: string
          format: binary
          description: The statement file, as the bank exported it
        export_balance:
          $ref: '#/components/schemas/DecimalText'
        export_balance_confirmation:
          $ref: '#/components/schemas/DecimalText'
    StatementImportUpload:
      type: object
      description: A statement file with its Export balance
      required:
        - file
        - export_balance
      properties:
        file:
          type: string
          format: binary
          description: The statement file, as the bank exported it
        export_balance:
          $ref: '#/components/schemas/DecimalText'
        preview_id:
          type: string
          maxLength: 128
          description: The preview's ID; required for the Account's first Statement import
    StatementImportPreview:
      type: object
      description: What an Account's first Statement import would record; nothing is recorded yet
      required:
        - preview_id
        - opening_balance
        - start_date
        - export_balance
        - row_count
        - rows_ignored_before_start_date
        - rows_ignored_in_closed_months
        - rows_total
      properties:
        preview_id:
          type: string
          description: |
            Ties a confirming upload to this preview: a hash of the Account,
            the Connection, the file, the Export balance and the mapping
            version, so the server keeps no state
        opening_balance:
          $ref: '#/components/schemas/Money'
        start_date:
          type: string
          format: date
          description: The Account's start date, the date of its Opening balance
          example: '2026-01-01'
        export_balance:
          $ref: '#/components/schemas/Money'
        row_count:
          type: integer
          format: int32
          description: The rows that would become Imported transactions
          example: 42
        rows_ignored_before_start_date:
          type: integer
          format: int32
          description: The rows booked before the Account's start date, which are ignored
          example: 3
        rows_ignored_in_closed_months:
          type: integer
          format: int32
          description: |
            The rows booked in a closed month, which are ignored (ADR-0024);
            always 0 here, since a first import never meets a closed month
          example: 0
        rows_total:
          $ref: '#/components/schemas/Money'
    StatementImport:
      type: object
      description: A Statement import
      required:
        - statement_import_id
        - connection_id
        - account_id
        - export_balance
        - rows_imported
        - rows_skipped_as_certain_repeats
        - suspected_duplicates
        - rows_ignored_before_start_date
        - rows_ignored_in_closed_months
        - rows_total
        - balance_check
        - void_blocked_by
        - imported_at
      properties:
        statement_import_id:
          type: string
          format: uuid
          description: The Statement import's ID (UUIDv7)
        connection_id:
          type: string
          format: uuid
          description: The Connection the file came through
        account_id:
          type: string
          format: uuid
          description: The Account the rows belong to
        export_balance:
          $ref: '#/components/schemas/Money'
        rows_imported:
          type: integer
          format: int32
          description: The rows that became Imported transactions
          example: 42
        rows_skipped_as_certain_repeats:
          type: integer
          format: int32
          description: |
            The rows skipped because an earlier Imported transaction of the
            Account has the same bank transaction ID, Booking date and amount
          example: 12
        suspected_duplicates:
          type: integer
          format: int32
          description: |
            The imported rows (counted in `rows_imported`) that only look like
            an earlier Imported transaction of the Account and wait to be kept
            or Discarded
          example: 2
        rows_ignored_before_start_date:
          type: integer
          format: int32
          description: The rows booked before the Account's start date, which were ignored
          example: 3
        rows_ignored_in_closed_months:
          type: integer
          format: int32
          description: The rows booked in a closed month, which were ignored (ADR-0024)
          example: 5
        rows_total:
          $ref: '#/components/schemas/Money'
        opening_balance:
          $ref: '#/components/schemas/Money'
        balance_check:
          type: string
          description: |
            The Balance check; the first import passes it by construction,
            and a later import without Suspected duplicates that fails it is
            refused. A later import with Suspected duplicates is `WAITING`
            until the last one is kept or Discarded, and then `PASSED` or
            `FAILED`
          x-extensible-enum:
            - PASSED
            - WAITING
            - FAILED
          example: PASSED
        imported_at:
          type: string
          format: date-time
          description: When the import was recorded
          example: '2026-02-01T09:30:00Z'
        voided_at:
          type: string
          format: date-time
          description: When the import was voided; absent while it isn't
          example: '2026-02-02T10:00:00Z'
        void_blocked_by:
          type: array
          description: |
            Every reason Void would be refused right now; empty when it is
            allowed. `NOT_LATEST`: a later import of the Account isn't voided.
            `HAS_ACCEPTED_ROWS`: some of its rows are Accepted.
            `TOUCHES_CLOSED_MONTH`: an Imported transaction it recorded is
            booked in a closed month, or it is the first import and the start
            date's month is closed. A voided import lists none.
          items:
            type: string
            x-extensible-enum:
              - NOT_LATEST
              - HAS_ACCEPTED_ROWS
              - TOUCHES_CLOSED_MONTH
            example: NOT_LATEST
    StatementImportList:
      type: object
      description: A Connection's Statement imports
      required:
        - items
      properties:
        items:
          type: array
          description: The Statement imports, in the order they were recorded
          items:
            $ref: '#/components/schemas/StatementImport'
    Notification:
      type: object
      description: |
        A Household-level message every member sees, with read state per
        User. A `SUSPECTED_DUPLICATES_FOUND` one links to the Statement
        import whose Suspected duplicates wait to be kept or Discarded, and
        carries `statement_import_id`, `connection_id`, `account_id` and
        `suspected_duplicates`. A `MEMBER_JOINED`, `MEMBER_LEFT` or
        `MEMBER_REMOVED` one carries `member`, and a `MEMBER_REMOVED` one
        also `removed_by`. Fields of other kinds are absent.
      required:
        - notification_id
        - kind
        - created_at
        - read
      properties:
        notification_id:
          type: string
          format: uuid
          description: The Notification's ID (UUIDv7)
        kind:
          type: string
          description: What the Notification is about
          x-extensible-enum:
            - SUSPECTED_DUPLICATES_FOUND
            - MEMBER_JOINED
            - MEMBER_LEFT
            - MEMBER_REMOVED
          example: SUSPECTED_DUPLICATES_FOUND
        statement_import_id:
          type: string
          format: uuid
          description: The Statement import the Notification links to
        connection_id:
          type: string
          format: uuid
          description: The Connection the Statement import came through
        account_id:
          type: string
          format: uuid
          description: The Account of the Statement import
        suspected_duplicates:
          type: integer
          format: int32
          description: The Suspected duplicates the Statement import brought
          example: 2
        member:
          $ref: '#/components/schemas/UserRef'
        removed_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          type: string
          format: date-time
          description: When the Notification was raised
          example: '2026-02-01T09:30:01Z'
        read:
          type: boolean
          description: Whether the caller has marked it read
          example: false
    NotificationList:
      type: object
      description: A Household's Notifications
      required:
        - items
      properties:
        items:
          type: array
          description: The Notifications, newest first
          items:
            $ref: '#/components/schemas/Notification'
    StatementImportConflictProblem:
      type: object
      description: Problem details (RFC 9457) of a refused Statement import
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type
          example: /problems/duplicate-statement-import
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Duplicate statement file
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 409
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        statement_import_id:
          type: string
          format: uuid
          description: The earlier Statement import of the same file
    StatementFileProblem:
      type: object
      description: |
        Problem details (RFC 9457) of a refused statement file. An unreadable
        file lists its bad `rows`; a failed Balance check gives the
        `expected_balance` (the Opening balance plus every non-Discarded
        Imported transaction, the file's new rows included), the
        `export_balance`, and the `difference` (Export balance minus
        expected balance); an Export balance that isn't the file's balance
        gives the `file_balance` (the balance on its newest row) and that
        row's `line`
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type
          example: /problems/unreadable-statement-file
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Unreadable statement file
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 422
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        rows:
          type: array
          description: Every line of the file that can't be read, with the reason
          items:
            $ref: '#/components/schemas/RowError'
        rows_in_closed_months_not_in_books:
          type: integer
          format: int32
          description: |
            For a failed Balance check: the file's rows booked in a closed
            month, and so ignored, that are neither certain repeats nor look
            like an earlier Imported transaction. The books likely miss them:
            Reopen back to their month and import again (ADR-0024)
          example: 1
        expected_balance:
          $ref: '#/components/schemas/Money'
        export_balance:
          $ref: '#/components/schemas/Money'
        difference:
          $ref: '#/components/schemas/Money'
        file_balance:
          $ref: '#/components/schemas/DecimalText'
        line:
          type: integer
          format: int32
          description: For an Export balance that differs from the file, the newest row's line
          example: 14
    RowError:
      type: object
      description: Why one line of a statement file can't be read
      required:
        - line
        - reason
      properties:
        line:
          type: integer
          format: int32
          description: The line in the file, counted from 1, including skipped lines and the header row
          example: 7
        reason:
          type: string
          description: Why the line can't be read
    AccountTransaction:
      type: object
      description: A Transaction as one line of an Account's single-entry list
      required:
        - transaction_id
        - amount
        - booking_date
        - transaction_date
        - description
        - category_id
        - category_name
      properties:
        transaction_id:
          type: string
          format: uuid
          description: The Transaction's ID (UUIDv7)
        amount:
          $ref: '#/components/schemas/Money'
        booking_date:
          type: string
          format: date
          description: The date the bank recorded it on the Account
          example: '2026-01-15'
        transaction_date:
          type: string
          format: date
          description: The date the purchase or payment happened
          example: '2026-01-14'
        description:
          type: string
          description: The Transaction's description
          example: Opening balance
        category_id:
          type: string
          format: uuid
          description: The Category on the other side of the Transaction
        category_name:
          type: string
          description: The Category's name
          example: Opening balance
        reversal_of_transaction_id:
          type: string
          format: uuid
          description: The Transaction this one reverses, when it is a reversal
        reversed_by_transaction_id:
          type: string
          format: uuid
          description: The Transaction that reversed this one, once it is reversed
        imported_transaction_id:
          type: string
          format: uuid
          description: The Imported transaction whose Accept recorded it
        counterpart_account_id:
          type: string
          format: uuid
          description: The other Account of the Transfer, when this is a Transfer leg
        match_id:
          type: string
          format: uuid
          description: The Match linking this Transfer leg to the other one; absent while it is In transit
        created_by_transfer:
          type: boolean
          description: Whether an Accept as Transfer recorded this cash leg automatically
    Transaction:
      type: object
      description: |
        A Transaction as seen from its Account: its signed amount there
        (positive is money in) and the Category on the other side
      required:
        - transaction_id
        - account_id
        - amount
        - booking_date
        - transaction_date
        - description
        - category_id
        - category_name
      properties:
        transaction_id:
          type: string
          format: uuid
          description: The Transaction's ID (UUIDv7)
        account_id:
          type: string
          format: uuid
          description: The Account it moves money on
        amount:
          $ref: '#/components/schemas/Money'
        booking_date:
          type: string
          format: date
          description: The date the bank recorded it on the Account
          example: '2026-01-15'
        transaction_date:
          type: string
          format: date
          description: The date the purchase or payment happened
          example: '2026-01-14'
        value_date:
          type: string
          format: date
          description: The date the money moved, when known
          example: '2026-01-16'
        description:
          type: string
          description: The Transaction's description
          example: Coffee
        payee:
          type: string
          description: The payee, when known
        category_id:
          type: string
          format: uuid
          description: The Category on the other side of the Transaction
        category_name:
          type: string
          description: The Category's name
          example: Uncategorised
        imported_transaction_id:
          type: string
          format: uuid
          description: The Imported transaction whose Accept recorded it
        reversal_of_transaction_id:
          type: string
          format: uuid
          description: The Transaction this one reverses, when it is a reversal
        reversed_by_transaction_id:
          type: string
          format: uuid
          description: The Transaction that reversed this one, once it is reversed
        counterpart_account_id:
          type: string
          format: uuid
          description: The other Account of the Transfer, when this is a Transfer leg
        match_id:
          type: string
          format: uuid
          description: The Match linking this Transfer leg to the other one; absent while it is In transit
        created_by_transfer:
          type: boolean
          description: Whether an Accept as Transfer recorded this cash leg automatically
    TransactionList:
      type: object
      description: A list of Transactions
      required:
        - items
      properties:
        items:
          type: array
          description: The Transactions
          items:
            $ref: '#/components/schemas/Transaction'
    CashTransactionCreation:
      type: object
      description: |
        A Transaction on a cash Account. Its other side is `category_id`, or
        `counterpart_account_id` for a Transfer leg, never both; neither
        leaves it in Uncategorised.
      required:
        - date
        - amount
        - description
      properties:
        date:
          type: string
          format: date
          description: The day it happened, both its Booking date and its Transaction date; not after today
          example: '2026-11-25'
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: What it was
          example: Coffee
        payee:
          type: string
          maxLength: 200
          description: Who was paid, or who paid
          example: Café Central
        category_id:
          type: string
          format: uuid
          description: The Category on the other side, with Accept's Category rules
        counterpart_account_id:
          type: string
          format: uuid
          description: The other Account, which makes this a Transfer leg
    Match:
      type: object
      description: A confirmed link between two records of the same money movement
      required:
        - match_id
        - kind
        - legs
        - confirmed_by
        - confirmed_at
      properties:
        match_id:
          type: string
          format: uuid
          description: The Match's ID (UUIDv7)
        kind:
          type: string
          description: What the Match links; `ACCOUNT_TRANSFER` is the two legs of a Transfer
          x-extensible-enum:
            - ACCOUNT_TRANSFER
          example: ACCOUNT_TRANSFER
        legs:
          type: array
          description: The two Transactions it links
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/MatchLeg'
        confirmed_by:
          type: string
          format: uuid
          description: The User who confirmed it
        confirmed_at:
          type: string
          format: date-time
          description: When it was confirmed
          example: '2026-11-25T18:00:00Z'
    MatchLeg:
      type: object
      description: One Transaction a Match links
      required:
        - transaction_id
        - account_id
      properties:
        transaction_id:
          type: string
          format: uuid
          description: The Transaction
        account_id:
          type: string
          format: uuid
          description: The Account it is on
    TransactionChange:
      type: object
      description: A change to a Transaction
      required:
        - category_id
      properties:
        category_id:
          type: string
          format: uuid
          description: The Category for the non-Account side; the Uncategorised Category is allowed
    AccountTransactionPage:
      type: object
      description: A page of an Account's Transactions
      required:
        - items
      properties:
        items:
          type: array
          description: The Transactions on this page
          items:
            $ref: '#/components/schemas/AccountTransaction'
        next_cursor:
          type: string
          description: The cursor of the next page; absent on the last page
    ImportedTransaction:
      type: object
      description: A row brought in by a Statement import
      required:
        - imported_transaction_id
        - statement_import_id
        - state
        - line
        - booking_date
        - transaction_date
        - amount
        - description
      properties:
        imported_transaction_id:
          type: string
          format: uuid
          description: The Imported transaction's ID (UUIDv7)
        statement_import_id:
          type: string
          format: uuid
          description: The Statement import that brought it in
        state:
          type: string
          description: Where it is in its review
          x-extensible-enum:
            - PENDING
            - SUSPECTED_DUPLICATE
            - ACCEPTED
            - DISCARDED
          example: PENDING
        line:
          type: integer
          format: int32
          description: Its line in the statement file
          example: 2
        booking_date:
          type: string
          format: date
          description: The date the bank recorded it on the Account
          example: '2026-01-15'
        transaction_date:
          type: string
          format: date
          description: The date the purchase or payment happened; the Booking date when the file has none
          example: '2026-01-14'
        value_date:
          type: string
          format: date
          description: The date the money moved; absent when the file has none
          example: '2026-01-16'
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          description: The bank's description
        payee:
          type: string
          description: The payee, when the file has one
        bank_transaction_id:
          type: string
          description: The bank's own transaction ID, when the file has one
        transaction_id:
          type: string
          format: uuid
          description: The Ledger Transaction that booked it, while it is Accepted
        resembles:
          $ref: '#/components/schemas/ResembledImportedTransaction'
    ResembledImportedTransaction:
      type: object
      description: |
        The earlier Imported transaction a Suspected duplicate looks like,
        shown next to it so a Household member can decide; kept after the
        Suspected duplicate is decided
      required:
        - imported_transaction_id
        - statement_import_id
        - state
        - booking_date
        - amount
        - description
      properties:
        imported_transaction_id:
          type: string
          format: uuid
          description: The earlier Imported transaction's ID
        statement_import_id:
          type: string
          format: uuid
          description: The Statement import that brought it in
        state:
          type: string
          description: Where it is in its review
          x-extensible-enum:
            - PENDING
            - SUSPECTED_DUPLICATE
            - ACCEPTED
            - DISCARDED
          example: ACCEPTED
        booking_date:
          type: string
          format: date
          description: The date the bank recorded it on the Account
          example: '2026-01-15'
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          description: The bank's description
        bank_transaction_id:
          type: string
          description: The bank's own transaction ID, when the file has one
    ImportedTransactionAcceptance:
      type: object
      description: How to Accept an Imported transaction
      properties:
        category_id:
          type: string
          format: uuid
          description: |
            The Category on the other side of the Transaction; absent, or the
            Uncategorised Category, leaves it in Uncategorised
        transfer_account_id:
          type: string
          format: uuid
          description: |
            The cash Account on the other side, which Accepts the row as a
            Transfer instead of with a Category
        match_transaction_id:
          type: string
          format: uuid
          description: |
            An In transit leg on `transfer_account_id` to Match the row to,
            instead of recording a new cash leg
    ImportedTransactionPage:
      type: object
      description: A page of an Account's Imported transactions
      required:
        - items
      properties:
        items:
          type: array
          description: The Imported transactions on this page
          items:
            $ref: '#/components/schemas/ImportedTransaction'
        next_cursor:
          type: string
          description: The cursor of the next page; absent on the last page
    AccountMonth:
      type: object
      description: One Booking month of an Account and what is left to do before it closes
      required:
        - account_id
        - booking_month
        - state
        - pending
        - suspected_duplicates
        - uncategorised
        - unchecked_statement_imports
        - reopen_blocked
        - transfer_legs_in_transit
      properties:
        account_id:
          type: string
          format: uuid
          description: The Account
        booking_month:
          type: string
          description: The Booking month, written YYYY-MM
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-01
        state:
          type: string
          description: |
            `OPEN` for the Account's one open month, `CLOSED` for every month
            before it and `NOT_OPEN_YET` for every month after it (ADR-0024)
          x-extensible-enum:
            - OPEN
            - CLOSED
            - NOT_OPEN_YET
          example: OPEN
        statement_balance:
          $ref: '#/components/schemas/Money'
        closed_at:
          type: string
          format: date-time
          description: When the month closed; absent unless it is closed
          example: '2026-02-03T18:00:00Z'
        computed_balance:
          $ref: '#/components/schemas/Money'
        pending:
          type: integer
          format: int32
          description: The month's Imported transactions waiting for review
          example: 4
        suspected_duplicates:
          type: integer
          format: int32
          description: The month's Imported transactions that are undecided Suspected duplicates
          example: 1
        uncategorised:
          type: integer
          format: int32
          description: The month's Transactions whose other side is in Uncategorised
          example: 2
        unchecked_statement_imports:
          type: array
          description: |
            The Statement imports with rows in or before the month whose
            Balance check hasn't passed, as a Month close refusal lists them;
            empty when there are none
          items:
            $ref: '#/components/schemas/UncheckedStatementImport'
        reopen_blocked:
          type: boolean
          description: |
            Whether a Reopen of this month would be refused right now: always
            true unless it is the Account's latest closed month and the open
            month has no Accepted Transactions that aren't reversed
          example: false
        counted_on:
          type: string
          format: date
          description: The day a closed cash month's Cash count was taken; absent otherwise
          example: '2026-12-03'
        transfer_legs_in_transit:
          type: integer
          format: int32
          description: |
            The month's Transfer legs that are In transit: not Matched and
            not reversed. They never stop a Month close.
          example: 0
    AccountMonthList:
      type: object
      description: An Account's Booking months
      required:
        - items
      properties:
        items:
          type: array
          description: Every Booking month of the Account, newest first
          items:
            $ref: '#/components/schemas/AccountMonth'
    MonthProblem:
      type: object
      description: |
        Problem details (RFC 9457) of a request that conflicts with the
        current state. When it is about a month (`/problems/month-closed`,
        `/problems/month-not-open-yet`, `/problems/month-not-ended`,
        `/problems/statement-import-touches-closed-month`), `booking_month`
        names it, `open_month` gives the Account's open month and
        `account_id` the Account, which can be another than the request's
        own, such as the cash Account of a Transfer
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type
          example: /problems/month-closed
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Month closed
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 409
        detail:
          type: string
          description: A human-readable explanation of this occurrence
          example: January 2026 is closed. Reopen it to change its entries.
        booking_month:
          type: string
          description: The month the problem is about, written YYYY-MM
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-01
        open_month:
          type: string
          description: The Account's open month, written YYYY-MM
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-02
        account_id:
          type: string
          format: uuid
          description: The Account whose month it is
    MonthReopenProblem:
      type: object
      description: |
        Problem details (RFC 9457) of a refused Reopen. `reasons` lists every
        failed condition; for `OPEN_MONTH_HAS_ACCEPTED_TRANSACTIONS` the
        `open_month` and the `accepted` count are given beside it
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type
          example: /problems/month-reopen-refused
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Month can't be reopened
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 409
        detail:
          type: string
          description: A human-readable explanation of this occurrence
          example: February 2026 has 3 Accepted Transactions. Reverse them before reopening January 2026.
        reasons:
          type: array
          description: Every condition that stops the month being reopened
          items:
            type: string
            x-extensible-enum:
              - NOT_CLOSED
              - NOT_LATEST_CLOSED
              - OPEN_MONTH_HAS_ACCEPTED_TRANSACTIONS
            example: OPEN_MONTH_HAS_ACCEPTED_TRANSACTIONS
        booking_month:
          type: string
          description: The month asked to reopen, written YYYY-MM
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-01
        open_month:
          type: string
          description: The Account's open month, written YYYY-MM
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-02
        accepted:
          type: integer
          format: int32
          description: The open month's Accepted Transactions that aren't reversed
          example: 3
    MonthClosing:
      type: object
      description: |
        The Statement balance a month closes with; for a cash Account, the
        amount counted and the day it was counted
      required:
        - statement_balance
      properties:
        statement_balance:
          $ref: '#/components/schemas/Money'
        counted_on:
          type: string
          format: date
          description: |
            The day a cash Account's cash was counted: after the month's last
            day and no later than today. Required for a cash Account, refused
            for any other.
          example: '2026-12-03'
    TransferProblem:
      type: object
      description: |
        Problem details (RFC 9457) of a request that can't be carried out.
        A refused Transfer (`/problems/invalid-transfer`) gives its `reason`.
        A Category whose kind doesn't fit the amount's sign
        (`/problems/category-direction`) gives `category_id`,
        `category_kind` and `direction`.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type
          example: /problems/invalid-transfer
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Invalid Transfer
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 422
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        reason:
          type: string
          description: Why the Transfer is refused
          x-extensible-enum:
            - CATEGORY_AND_TRANSFER
            - MATCH_WITHOUT_TRANSFER
            - COUNTERPART_NOT_CASH
            - SAME_ACCOUNT
            - CURRENCY_MISMATCH
            - UNKNOWN_ACCOUNT
            - NOT_A_MATCHING_LEG
          example: COUNTERPART_NOT_CASH
        category_id:
          type: string
          format: uuid
          description: The Category refused for its kind
        category_kind:
          type: string
          description: |
            The refused Category's kind: an Income Category takes only money
            in, an Expense Category only money out
          x-extensible-enum:
            - INCOME
            - EXPENSE
          example: EXPENSE
        direction:
          type: string
          description: |
            Which way the amount moves on the Account: `IN` (positive) or
            `OUT` (negative)
          x-extensible-enum:
            - IN
            - OUT
          example: IN
    MonthCloseProblem:
      type: object
      description: |
        Problem details (RFC 9457) of a refused Month close. `reasons` lists
        every failed condition, each with its details beside it: the
        `pending`, `suspected_duplicates` and `uncategorised` counts, the
        `unchecked_statement_imports`, and for a balance mismatch the
        `computed_balance`, the `statement_balance` and the `difference`
        (Statement balance minus computed balance)
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type
          example: /problems/month-close-refused
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Month can't close
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 422
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        reasons:
          type: array
          description: Every condition that stops the month closing
          items:
            type: string
            x-extensible-enum:
              - PENDING
              - SUSPECTED_DUPLICATES
              - UNCATEGORISED
              - BALANCE_CHECK_NOT_PASSED
              - BALANCE_MISMATCH
            example: BALANCE_MISMATCH
        pending:
          type: integer
          format: int32
          description: The month's Imported transactions waiting for review
          example: 4
        suspected_duplicates:
          type: integer
          format: int32
          description: The month's undecided Suspected duplicates
          example: 1
        uncategorised:
          type: integer
          format: int32
          description: The month's Transactions in Uncategorised
          example: 2
        unchecked_statement_imports:
          type: array
          description: The Statement imports with rows in or before the month whose Balance check hasn't passed
          items:
            $ref: '#/components/schemas/UncheckedStatementImport'
        computed_balance:
          $ref: '#/components/schemas/Money'
        statement_balance:
          $ref: '#/components/schemas/Money'
        difference:
          $ref: '#/components/schemas/Money'
    UncheckedStatementImport:
      type: object
      description: A Statement import whose Balance check stops a Month close
      required:
        - statement_import_id
        - balance_check
      properties:
        statement_import_id:
          type: string
          format: uuid
          description: The Statement import
        balance_check:
          type: string
          description: Its Balance check
          x-extensible-enum:
            - WAITING
            - FAILED
          example: WAITING
    Money:
      type: object
      description: |
        An amount of money: an exact decimal in its currency, with that
        currency's number of decimal places (ADR-0007), for example EUR 2,
        JPY 0, BTC 8 and ETH 18.
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          format: decimal
          x-ogen-type: github.com/mumia/wallet-accountant/internal/platform/httpapi/amount.Amount
          description: |
            The exact amount, written with its currency's number of decimal
            places (trailing zeros included); never a binary floating-point
            value
          example: 1234.56
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    Currency:
      type: object
      description: A currency and the number of decimal places its amounts use
      required:
        - code
        - decimal_places
      properties:
        code:
          $ref: '#/components/schemas/CurrencyCode'
        decimal_places:
          type: integer
          format: int32
          minimum: 0
          description: How many decimal places the currency's amounts use
          example: 2
    CurrencyList:
      type: object
      description: The currencies Wallet Accountant knows
      required:
        - items
      properties:
        items:
          type: array
          description: The currencies, sorted by code
          items:
            $ref: '#/components/schemas/Currency'
    CurrencyCode:
      type: string
      description: A currency code, such as an ISO 4217 code
      pattern: '^[A-Z]{3,5}$'
      example: EUR
    Problem:
      type: object
      description: Problem details (RFC 9457)
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type; `about:blank` when the status says it all
          example: /problems/registration-required
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Registration required
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 403
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence of the problem
