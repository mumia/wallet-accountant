openapi: 3.0.3
info:
  title: Wallet Accountant API
  version: 0.1.0
  description: |
    Wallet Accountant tracks where a Household's money goes and how that
    compares to what it planned. This document is the contract between the
    backend and the frontend (ADR-0008). Every error is returned as
    `application/problem+json` (RFC 9457).
  contact:
    name: Wallet Accountant maintainers
    url: https://github.com/mumia/wallet-accountant
    email: wallet-accountant@users.noreply.github.com
  x-api-id: 0b9c5a2e-6f0e-4d8a-9a51-3f3c2d7e8b41
  x-audience: external-partner
servers:
  - url: http://localhost:8080
    description: Local development (`make run`)
security:
  - bearer_auth: []
tags:
  - name: Users
    description: The signed-in identity and its registration
  - name: Households
    description: Households, the only ownership and privacy boundary (ADR-0003)
  - name: Categories
    description: What money was received for or spent on (ADR-0004)
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in User
      description: |
        Returns the User the bearer token belongs to, and whether they are
        Instance administrator. An identity that has signed in but not
        redeemed an Invitation is not a User yet and gets 403 with the
        problem type `/problems/registration-required` (ADR-0017).
      tags:
        - Users
      responses:
        '200':
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /registrations:
    post:
      operationId: createRegistration
      summary: Redeem an Invitation
      description: |
        Redeems an Invitation code, making the signed-in identity a User with
        the role the Invitation grants (ADR-0017). An unknown, expired,
        superseded or already used code gets 422 with one generic problem, so
        codes can't be probed. An identity that is already a User gets 409.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: The new User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households:
    post:
      operationId: createHousehold
      summary: Create a Household
      description: |
        Creates a Household with a name and a Base currency. The caller
        becomes its first member, and its Internal Categories (Opening
        balance, Household transfer, Uncategorised) are created with it.
        An unregistered caller gets 403 with the problem type
        `/problems/registration-required`.
      tags:
        - Households
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreation'
      responses:
        '201':
          description: The new Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listHouseholds
      summary: The caller's Households
      description: |
        Lists the Households the caller is a member of. An unregistered
        caller gets 403 with the problem type `/problems/registration-required`.
      tags:
        - Households
      responses:
        '200':
          description: The caller's Households
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}:
    get:
      operationId: getHousehold
      summary: A Household
      description: |
        Returns a Household the caller is a member of. Any other Household,
        and every Household for an unregistered caller, is 404: a 403 would
        confirm that it exists.
      tags:
        - Households
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/categories:
    post:
      operationId: createCategory
      summary: Create a Category
      description: |
        Creates an Income or Expense Category, at the root or under
        `parent_id`. A sub-Category takes its parent's kind, so `kind` may be
        left out; a different kind is refused. Internal Categories belong to
        the system: creating one, or a Category under one, gets 422 with the
        problem type `/problems/internal-category`. A name already used by a
        sibling (ignoring case and surrounding spaces) gets 409 with the
        problem type `/problems/category-name-taken`. Any other refusal is
        422 with the problem type `/problems/invalid-category`.
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreation'
      responses:
        '201':
          description: The new Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listCategories
      summary: The Household's Category tree
      description: |
        Lists every Category of the Household as a tree, Internal Categories
        included: the root Categories, each with its sub-Categories in
        `children`. Siblings are sorted by name.
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's Category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/categories/{category_id}:
    patch:
      operationId: changeCategory
      summary: Rename or move a Category
      description: |
        Renames the Category when `name` is given, and moves it when
        `parent_id` is given: under that Category, or to the root when it is
        `null`. A Category keeps its kind, so it can only move under a parent
        of the same kind, and never under itself or one of its
        sub-Categories. Internal Categories can't be renamed or moved, and
        nothing can be moved under one (422, `/problems/internal-category`).
        A name already used by a sibling in the place the Category ends up
        gets 409 (`/problems/category-name-taken`); any other refusal is 422
        (`/problems/invalid-category`).
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/CategoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryChange'
      responses:
        '200':
          description: The Category as changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A key the client chooses for one request, such as a UUID. Sending the
        request again with the same key and body returns the stored response
        without repeating it; the same key with a different body gets 422.
        Keys are scoped to the caller.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    HouseholdID:
      name: household_id
      in: path
      required: true
      description: The Household's ID
      schema:
        type: string
        format: uuid
    CategoryID:
      name: category_id
      in: path
      required: true
      description: The Category's ID
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An OpenID Connect access token issued by the instance's provider (ADR-0010)
  responses:
    Unauthorized:
      description: The bearer token is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller may not do this, for example because it is not registered yet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state, for example the caller is already registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request is well-formed but can't be carried out, for example an invalid Invitation code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource doesn't exist, or the caller may not know it does
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: An error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Me:
      type: object
      description: The signed-in User
      required:
        - user_id
        - is_instance_administrator
      properties:
        user_id:
          type: string
          format: uuid
          description: The User's ID (UUIDv7)
        is_instance_administrator:
          type: boolean
          description: Whether the User controls who is admitted to the instance
    Registration:
      type: object
      description: An Invitation code to redeem
      required:
        - invitation_code
      properties:
        invitation_code:
          type: string
          minLength: 1
          maxLength: 256
          description: The Invitation code, exactly as it was handed out
    HouseholdCreation:
      type: object
      description: A new Household
      required:
        - name
        - base_currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The Household's name
          example: Home
        base_currency:
          $ref: '#/components/schemas/CurrencyCode'
    Household:
      type: object
      description: A Household
      required:
        - household_id
        - name
        - base_currency
      properties:
        household_id:
          type: string
          format: uuid
          description: The Household's ID (UUIDv7)
        name:
          type: string
          description: The Household's name
          example: Home
        base_currency:
          $ref: '#/components/schemas/CurrencyCode'
    HouseholdList:
      type: object
      description: The caller's Households
      required:
        - items
      properties:
        items:
          type: array
          description: The Households, in the order they were created
          items:
            $ref: '#/components/schemas/Household'
    Category:
      type: object
      description: A Category
      required:
        - category_id
        - name
        - kind
      properties:
        category_id:
          type: string
          format: uuid
          description: The Category's ID (UUIDv7)
        name:
          type: string
          description: The Category's name
          example: Uncategorised
        kind:
          type: string
          description: What the Category is for; Internal Categories belong to the system
          x-extensible-enum:
            - INCOME
            - EXPENSE
            - INTERNAL
          example: INTERNAL
        parent_id:
          type: string
          format: uuid
          description: The parent Category's ID; absent for a root Category
    CategoryNode:
      type: object
      description: A Category in the Household's Category tree, with its sub-Categories
      required:
        - category_id
        - name
        - kind
      properties:
        category_id:
          type: string
          format: uuid
          description: The Category's ID (UUIDv7)
        name:
          type: string
          description: The Category's name
          example: Eating out
        kind:
          type: string
          description: What the Category is for; Internal Categories belong to the system
          x-extensible-enum:
            - INCOME
            - EXPENSE
            - INTERNAL
          example: EXPENSE
        parent_id:
          type: string
          format: uuid
          description: The parent Category's ID; absent for a root Category
        children:
          type: array
          description: The sub-Categories, sorted by name; absent when there are none
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryTree:
      type: object
      description: A Household's Categories as a tree
      required:
        - items
      properties:
        items:
          type: array
          description: The root Categories, sorted by name, each with its sub-Categories
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryCreation:
      type: object
      description: A new Category
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The Category's name, unique among its siblings
          example: Coffee
        kind:
          type: string
          description: |
            INCOME or EXPENSE; required for a root Category. A sub-Category
            takes its parent's kind.
          x-extensible-enum:
            - INCOME
            - EXPENSE
          example: EXPENSE
        parent_id:
          type: string
          format: uuid
          description: The Category to create it under; absent for a root Category
    CategoryChange:
      type: object
      description: A change to a Category; a property left out stays as it is
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The new name, unique among its siblings
          example: Espresso
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: The Category to move it under, or `null` to make it a root Category
    CurrencyCode:
      type: string
      description: A currency code, such as an ISO 4217 code
      pattern: '^[A-Z]{3,5}$'
      example: EUR
    Problem:
      type: object
      description: Problem details (RFC 9457)
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type; `about:blank` when the status says it all
          example: /problems/registration-required
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Registration required
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 403
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence of the problem
