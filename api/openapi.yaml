openapi: 3.0.3
info:
  title: Wallet Accountant API
  version: 0.1.0
  description: |
    Wallet Accountant tracks where a Household's money goes and how that
    compares to what it planned. This document is the contract between the
    backend and the frontend (ADR-0008). Every error is returned as
    `application/problem+json` (RFC 9457).
  contact:
    name: Wallet Accountant maintainers
    url: https://github.com/mumia/wallet-accountant
    email: wallet-accountant@users.noreply.github.com
  x-api-id: 0b9c5a2e-6f0e-4d8a-9a51-3f3c2d7e8b41
  x-audience: external-partner
servers:
  - url: http://localhost:8080
    description: Local development (`make run`)
security:
  - bearer_auth: []
tags:
  - name: Users
    description: The signed-in identity and its registration
  - name: Households
    description: Households, the only ownership and privacy boundary (ADR-0003)
  - name: Categories
    description: What money was received for or spent on (ADR-0004)
  - name: Accounts
    description: Places where money is held or owed (ADR-0004)
paths:
  /me:
    get:
      operationId: getMe
      summary: The signed-in User
      description: |
        Returns the User the bearer token belongs to, and whether they are
        Instance administrator. An identity that has signed in but not
        redeemed an Invitation is not a User yet and gets 403 with the
        problem type `/problems/registration-required` (ADR-0017).
      tags:
        - Users
      responses:
        '200':
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /registrations:
    post:
      operationId: createRegistration
      summary: Redeem an Invitation
      description: |
        Redeems an Invitation code, making the signed-in identity a User with
        the role the Invitation grants (ADR-0017). An unknown, expired,
        superseded or already used code gets 422 with one generic problem, so
        codes can't be probed. An identity that is already a User gets 409.
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: The new User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
  /households:
    post:
      operationId: createHousehold
      summary: Create a Household
      description: |
        Creates a Household with a name and a Base currency. The caller
        becomes its first member, and its Internal Categories (Opening
        balance, Household transfer, Uncategorised) are created with it.
        An unregistered caller gets 403 with the problem type
        `/problems/registration-required`.
      tags:
        - Households
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreation'
      responses:
        '201':
          description: The new Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listHouseholds
      summary: The caller's Households
      description: |
        Lists the Households the caller is a member of. An unregistered
        caller gets 403 with the problem type `/problems/registration-required`.
      tags:
        - Households
      responses:
        '200':
          description: The caller's Households
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}:
    get:
      operationId: getHousehold
      summary: A Household
      description: |
        Returns a Household the caller is a member of. Any other Household,
        and every Household for an unregistered caller, is 404: a 403 would
        confirm that it exists.
      tags:
        - Households
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/categories:
    get:
      operationId: listCategories
      summary: The Household's Categories
      description: |
        Lists every Category of the Household, Internal Categories included.
        The tree is given by each Category's `parent_id`.
      tags:
        - Categories
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's Categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts:
    post:
      operationId: addAccount
      summary: Add an Account
      description: |
        Adds an Account with a name, a kind, an Account currency and a start
        date. The new Account awaits its first Statement import and has no
        balance: its Opening balance is worked out from that import, never
        typed (ADR-0018). Cash Accounts are not supported yet; a `CASH` or
        unknown kind, an unknown currency or a blank name gets 422 with the
        problem type `/problems/invalid-account`.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreation'
      responses:
        '201':
          description: The new Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listAccounts
      summary: The Household's Accounts
      description: Lists every Account of the Household, in the order they were added.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
      responses:
        '200':
          description: The Household's Accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
  /households/{household_id}/accounts/{account_id}:
    get:
      operationId: getAccount
      summary: An Account
      description: |
        Returns an Account of the Household with its current balance, or
        that it is awaiting its first Statement import.
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/HouseholdID'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: The Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A key the client chooses for one request, such as a UUID. Sending the
        request again with the same key and body returns the stored response
        without repeating it; the same key with a different body gets 422.
        Keys are scoped to the caller.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    HouseholdID:
      name: household_id
      in: path
      required: true
      description: The Household's ID
      schema:
        type: string
        format: uuid
    AccountID:
      name: account_id
      in: path
      required: true
      description: The Account's ID
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An OpenID Connect access token issued by the instance's provider (ADR-0010)
  responses:
    Unauthorized:
      description: The bearer token is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller may not do this, for example because it is not registered yet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state, for example the caller is already registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: The request is well-formed but can't be carried out, for example an invalid Invitation code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource doesn't exist, or the caller may not know it does
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: An error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Me:
      type: object
      description: The signed-in User
      required:
        - user_id
        - is_instance_administrator
      properties:
        user_id:
          type: string
          format: uuid
          description: The User's ID (UUIDv7)
        is_instance_administrator:
          type: boolean
          description: Whether the User controls who is admitted to the instance
    Registration:
      type: object
      description: An Invitation code to redeem
      required:
        - invitation_code
      properties:
        invitation_code:
          type: string
          minLength: 1
          maxLength: 256
          description: The Invitation code, exactly as it was handed out
    HouseholdCreation:
      type: object
      description: A new Household
      required:
        - name
        - base_currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The Household's name
          example: Home
        base_currency:
          $ref: '#/components/schemas/CurrencyCode'
    Household:
      type: object
      description: A Household
      required:
        - household_id
        - name
        - base_currency
      properties:
        household_id:
          type: string
          format: uuid
          description: The Household's ID (UUIDv7)
        name:
          type: string
          description: The Household's name
          example: Home
        base_currency:
          $ref: '#/components/schemas/CurrencyCode'
    HouseholdList:
      type: object
      description: The caller's Households
      required:
        - items
      properties:
        items:
          type: array
          description: The Households, in the order they were created
          items:
            $ref: '#/components/schemas/Household'
    Category:
      type: object
      description: A Category
      required:
        - category_id
        - name
        - kind
      properties:
        category_id:
          type: string
          format: uuid
          description: The Category's ID (UUIDv7)
        name:
          type: string
          description: The Category's name
          example: Uncategorised
        kind:
          type: string
          description: What the Category is for; Internal Categories belong to the system
          x-extensible-enum:
            - INCOME
            - EXPENSE
            - INTERNAL
          example: INTERNAL
        parent_id:
          type: string
          format: uuid
          description: The parent Category's ID; absent for a root Category
    CategoryList:
      type: object
      description: A Household's Categories
      required:
        - items
      properties:
        items:
          type: array
          description: Every Category of the Household
          items:
            $ref: '#/components/schemas/Category'
    AccountCreation:
      type: object
      description: A new Account. There is no Opening balance field; the first Statement import works it out (ADR-0018).
      required:
        - name
        - kind
        - currency
        - start_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The Account's name
          example: Main
        kind:
          $ref: '#/components/schemas/AccountKind'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        start_date:
          type: string
          format: date
          description: The day the Account's history begins, and the date of its Opening balance
          example: '2026-01-01'
    Account:
      type: object
      description: An Account
      required:
        - account_id
        - name
        - kind
        - currency
        - start_date
        - awaiting_first_statement_import
      properties:
        account_id:
          type: string
          format: uuid
          description: The Account's ID (UUIDv7)
        name:
          type: string
          description: The Account's name
          example: Main
        kind:
          $ref: '#/components/schemas/AccountKind'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        start_date:
          type: string
          format: date
          description: The day the Account's history begins, and the date of its Opening balance
          example: '2026-01-01'
        awaiting_first_statement_import:
          type: boolean
          description: Whether the Account still awaits the first Statement import that records its Opening balance
        balance:
          $ref: '#/components/schemas/Money'
    AccountList:
      type: object
      description: A Household's Accounts
      required:
        - items
      properties:
        items:
          type: array
          description: The Accounts, in the order they were added
          items:
            $ref: '#/components/schemas/Account'
    AccountKind:
      type: string
      description: What sort of place the Account is. `CASH` is not supported yet and is refused.
      x-extensible-enum:
        - BANK_ACCOUNT
        - CREDIT_CARD
        - LOAN
        - CRYPTO_WALLET
      example: BANK_ACCOUNT
    Money:
      type: object
      description: |
        An amount of money: an exact decimal in its currency, with that
        currency's number of decimal places (ADR-0007), for example EUR 2,
        JPY 0, BTC 8 and ETH 18.
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          format: decimal
          description: The exact amount; never a binary floating-point value
          example: 1234.56
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    CurrencyCode:
      type: string
      description: A currency code, such as an ISO 4217 code
      pattern: '^[A-Z]{3,5}$'
      example: EUR
    Problem:
      type: object
      description: Problem details (RFC 9457)
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the problem type; `about:blank` when the status says it all
          example: /problems/registration-required
        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Registration required
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code
          example: 403
        detail:
          type: string
          description: A human-readable explanation of this occurrence
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence of the problem
