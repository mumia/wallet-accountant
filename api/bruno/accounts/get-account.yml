info:
  name: An Account
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/households/:household_id/accounts/:account_id'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: account_id
      value: '{{account_id}}'
      type: path
      description: The Account's ID
  auth: inherit
docs: |-
  Returns an Account of the Household with its current balance, or
  that it is awaiting its first Statement import.

  Operation `getAccount`.
