name: local
variables:
  - name: baseUrl
    value: http://localhost:8080
    description: The API (make run)
  - name: authUrl
    value: http://localhost:8081
    description: The OpenID Connect provider, WA_OIDC_ISSUER (Zitadel from make dev-up)
  - name: clientId
    value: '{{process.env.WA_OAUTH_CLIENT_ID}}'
    description: The client ID of the Zitadel application api-clients; make dev-up writes it to .env
  - name: household_id
    value: ""
    description: The Household's ID
  - name: category_id
    value: ""
    description: The Category's ID
  - name: account_id
    value: ""
    description: The Account's ID
  - name: connection_id
    value: ""
    description: The Connection's ID
  - name: booking_month
    value: 2026-01
    description: The Booking month, written YYYY-MM
  - name: imported_transaction_id
    value: ""
    description: The Imported transaction's ID
  - name: transaction_id
    value: ""
    description: The Transaction's ID
  - name: statement_import_id
    value: ""
    description: The Statement import's ID
  - name: notification_id
    value: ""
    description: The Notification's ID
