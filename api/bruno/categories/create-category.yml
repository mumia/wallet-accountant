info:
  name: Create a Category
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/households/:household_id/categories'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
  headers:
    - name: Idempotency-Key
      value: '{{$randomUUID}}'
      description: A key the client chooses for one request, such as a UUID.
  body:
    type: json
    data: |-
      {
        "name": "Coffee",
        "kind": "EXPENSE",
        "parent_id": "00000000-0000-0000-0000-000000000000"
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("category_id", res.body.category_id);
        }
docs: |-
  Creates an Income or Expense Category, at the root or under
  `parent_id`. A sub-Category takes its parent's kind, so `kind` may be
  left out; a different kind is refused. Internal Categories belong to
  the system: creating one, or a Category under one, gets 422 with the
  problem type `/problems/internal-category`. A name already used by a
  sibling (ignoring case and surrounding spaces) gets 409 with the
  problem type `/problems/category-name-taken`. Any other refusal is
  422 with the problem type `/problems/invalid-category`.

  Operation `createCategory`.
