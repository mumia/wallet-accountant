info:
  name: The Household's Category tree
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/households/:household_id/categories'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
  auth: inherit
docs: |-
  Lists every Category of the Household as a tree, Internal Categories
  included: the root Categories, each with its sub-Categories in
  `children`. Siblings are sorted by name.

  Operation `listCategories`.
