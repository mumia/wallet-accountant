info:
  name: A Connection's Statement imports
  type: http
  seq: 3
http:
  method: GET
  url: '{{baseUrl}}/households/:household_id/connections/:connection_id/statement-imports'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: connection_id
      value: '{{connection_id}}'
      type: path
      description: The Connection's ID
  auth: inherit
docs: |-
  Lists every Statement import of the Connection, in the order they were recorded.

  Operation `listStatementImports`.
