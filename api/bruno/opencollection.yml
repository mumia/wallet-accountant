opencollection: 1.0.0
info:
  name: Wallet Accountant API
request:
  headers:
    - name: Accept
      value: application/json
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: '{{authUrl}}/oauth/v2/authorize'
    accessTokenUrl: '{{authUrl}}/oauth/v2/token'
    refreshTokenUrl: '{{authUrl}}/oauth/v2/token'
    callbackUrl: https://oauth.usebruno.com/callback
    credentials:
      clientId: '{{clientId}}'
      placement: body
    scope: openid profile email offline_access
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
  variables:
    - name: baseUrl
      value: http://localhost:8080/api
      description: The API (make run, debug mode)
    - name: authUrl
      value: https://auth.localhost:18443
      description: The OpenID Connect provider, WA_OIDC_ISSUER (Zitadel in the local cluster, make local-up)
    - name: clientId
      value: '{{process.env.WA_OAUTH_CLIENT_ID}}'
      description: The client ID of the Zitadel application api-clients; make local-deploy writes it to .env
    - name: household_id
      value: ""
      description: The Household's ID
    - name: user_id
      value: ""
      description: The User's ID
    - name: invitation_id
      value: ""
      description: The Invitation's ID
    - name: category_id
      value: ""
      description: The Category's ID
    - name: account_id
      value: ""
      description: The Account's ID
    - name: connection_id
      value: ""
      description: The Connection's ID
    - name: booking_month
      value: 2026-01
      description: The Booking month, written YYYY-MM
    - name: imported_transaction_id
      value: ""
      description: The Imported transaction's ID
    - name: transaction_id
      value: ""
      description: The Transaction's ID
    - name: statement_import_id
      value: ""
      description: The Statement import's ID
    - name: notification_id
      value: ""
      description: The Notification's ID
docs:
  content: |-
    Wallet Accountant tracks where a Household's money goes and how that
    compares to what it planned. This document is the contract between the
    backend and the frontend (ADR-0008). Every error is returned as
    `application/problem+json` (RFC 9457).

    This collection is generated from api/openapi.yaml by `make generate` (internal/tools/opencollection);
    change the contract, not the requests. See README.md in this directory for signing in.
  type: text/markdown
bundled: false
extensions: {}
