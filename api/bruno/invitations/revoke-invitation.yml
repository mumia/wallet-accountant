info:
  name: Revoke an Invitation
  type: http
  seq: 3
http:
  method: DELETE
  url: '{{baseUrl}}/households/:household_id/invitations/:invitation_id'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: invitation_id
      value: '{{invitation_id}}'
      type: path
      description: The Invitation's ID
  auth: inherit
docs: |-
  Revokes an open Invitation of the Household, whichever member issued
  it. Its code then gets the same 422 as any invalid code. An
  Invitation that isn't open (redeemed, revoked or expired) gets 404.

  Operation `revokeInvitation`.
