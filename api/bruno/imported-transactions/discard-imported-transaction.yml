info:
  name: Discard a pending Imported transaction or a Suspected duplicate
  type: http
  seq: 5
http:
  method: POST
  url: '{{baseUrl}}/households/:household_id/imported-transactions/:imported_transaction_id/discard'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: imported_transaction_id
      value: '{{imported_transaction_id}}'
      type: path
      description: The Imported transaction's ID
  headers:
    - name: Idempotency-Key
      value: '{{$randomUUID}}'
      description: A key the client chooses for one request, such as a UUID.
  auth: inherit
docs: |-
  Discards a pending Imported transaction, for example one whose
  Transaction was reversed, or a Suspected duplicate confirmed as a
  repeat, so it never reaches the Ledger. Discarded is final: it
  doesn't count in later Balance checks. Deciding the last Suspected
  duplicate of a Statement import runs its waiting Balance check. One already
  Discarded gets 409 `/problems/imported-transaction-already-discarded`,
  and an Accepted one 409 `/problems/imported-transaction-already-accepted`
  (reverse its Transaction first). One booked in a closed month gets 409
  `/problems/month-closed`. A pending row booked in a month that isn't
  open yet gets 409 `/problems/month-not-open-yet`, but a Suspected
  duplicate there can still be Discarded (ADR-0024). Both problems name
  the `booking_month`, and the second also the Account's `open_month`.

  Operation `discardImportedTransaction`.
