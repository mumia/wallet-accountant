info:
  name: The Household's members
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/households/:household_id/members'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
  auth: inherit
docs: |-
  Lists every member of the Household, oldest first, with their
  display name and when they joined. Every member is equal and sees
  everything in the Household (ADR-0003).

  Operation `listMembers`.
