info:
  name: Create a Connection for an Account
  type: http
  seq: 1
http:
  method: POST
  url: '{{baseUrl}}/households/:household_id/accounts/:account_id/connections'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: account_id
      value: '{{account_id}}'
      type: path
      description: The Account's ID
  headers:
    - name: Idempotency-Key
      value: '{{$randomUUID}}'
      description: A key the client chooses for one request, such as a UUID.
  body:
    type: json
    data: |-
      {
        "name": "Statement file",
        "kind": "STATEMENT_FILE_IMPORT",
        "csv_mapping": {
          "encoding": "WINDOWS_1252",
          "delimiter": ";",
          "has_header_row": false,
          "skip_leading_lines": 0,
          "skip_trailing_lines": 0,
          "date_format": "DD/MM/YYYY",
          "decimal_separator": ",",
          "thousands_separator": ".",
          "amount_layout": "SIGNED",
          "positive_amount_means": "MONEY_IN",
          "columns": {
            "booking_date": {
              "header": "Amount",
              "position": 3
            },
            "description": {
              "header": "Amount",
              "position": 3
            },
            "amount": {
              "header": "Amount",
              "position": 3
            },
            "debit": {
              "header": "Amount",
              "position": 3
            },
            "credit": {
              "header": "Amount",
              "position": 3
            },
            "transaction_date": {
              "header": "Amount",
              "position": 3
            },
            "value_date": {
              "header": "Amount",
              "position": 3
            },
            "payee": {
              "header": "Amount",
              "position": 3
            },
            "bank_transaction_id": {
              "header": "Amount",
              "position": 3
            },
            "balance": {
              "header": "Amount",
              "position": 3
            }
          }
        }
      }
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("connection_id", res.body.connection_id);
        }
docs: |-
  Creates a statement file import Connection for the Account, with a
  name and optionally the CSV mapping of the bank's statement files.
  The name is trimmed, 1 to 100 characters, and unique within the
  Account ignoring case: a name already used gets 422
  `/problems/connection-name-taken`. Live bank feeds are not supported
  yet; a `BANK_FEED` or unknown kind, or a name of only spaces, gets
  422 with the problem type `/problems/invalid-connection`; an empty or
  too long name gets 400. An invalid
  mapping gets 422 with `/problems/invalid-csv-mapping`, and nothing is
  created. A cash Account is kept by hand and takes no Connection: it
  gets 422 `/problems/invalid-connection`.

  Operation `createConnection`.
