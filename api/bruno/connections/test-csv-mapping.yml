info:
  name: Test an unsaved CSV mapping on a sample file
  type: http
  seq: 5
http:
  method: POST
  url: '{{baseUrl}}/households/:household_id/accounts/:account_id/csv-mapping-tests'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: account_id
      value: '{{account_id}}'
      type: path
      description: The Account's ID
  headers:
    - name: Idempotency-Key
      value: '{{$randomUUID}}'
      description: A key the client chooses for one request, such as a UUID.
  body:
    type: multipart-form
    data:
      - name: csv_mapping
        type: text
        value: |-
          {
            "encoding": "WINDOWS_1252",
            "delimiter": ";",
            "has_header_row": false,
            "skip_leading_lines": 0,
            "date_format": "DD/MM/YYYY",
            "decimal_separator": ",",
            "thousands_separator": ".",
            "amount_layout": "SIGNED",
            "positive_amount_means": "MONEY_IN",
            "columns": {
              "booking_date": {
                "header": "Amount",
                "position": 3
              },
              "description": {
                "header": "Amount",
                "position": 3
              },
              "amount": {
                "header": "Amount",
                "position": 3
              },
              "debit": {
                "header": "Amount",
                "position": 3
              },
              "credit": {
                "header": "Amount",
                "position": 3
              },
              "transaction_date": {
                "header": "Amount",
                "position": 3
              },
              "value_date": {
                "header": "Amount",
                "position": 3
              },
              "payee": {
                "header": "Amount",
                "position": 3
              },
              "bank_transaction_id": {
                "header": "Amount",
                "position": 3
              }
            }
          }
        description: How a bank lays out its statement CSV.
      - name: file
        type: file
        value: []
        description: The sample statement file, as the bank exported it; it isn't kept
  auth: inherit
docs: |-
  Reads a sample statement file with an unsaved CSV mapping, exactly as
  an upload would read it, and returns the first 10 readable rows, how
  many rows are readable, and every unreadable line with its reason.
  Amounts are read in the Account currency. Rows before the Account's
  start date are shown too: this tests the mapping, not an import. It
  records nothing and doesn't keep the sample. An invalid mapping gets
  422 `/problems/invalid-csv-mapping`, whose detail lists every
  problem, and a file with no rows at all 422
  `/problems/empty-statement-file`.

  Operation `testCsvMapping`.
