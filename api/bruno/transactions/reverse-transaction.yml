info:
  name: Reverse a Transaction
  type: http
  seq: 5
http:
  method: POST
  url: '{{baseUrl}}/households/:household_id/transactions/:transaction_id/reverse'
  params:
    - name: household_id
      value: '{{household_id}}'
      type: path
      description: The Household's ID
    - name: transaction_id
      value: '{{transaction_id}}'
      type: path
      description: The Transaction's ID
  headers:
    - name: Idempotency-Key
      value: '{{$randomUUID}}'
      description: A key the client chooses for one request, such as a UUID.
  auth: inherit
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("transaction_id", res.body.transaction_id);
        }
docs: |-
  Reverses a mistaken Transaction without editing or deleting it
  (ADR-0018): a reversing Transaction is recorded with the opposite
  Postings, the same Booking date and a link to the original, and both
  appear in the Account's Transaction list. Neither counts as
  Uncategorised any more. When an Accept recorded the Transaction, its
  Imported transaction goes back to pending in the same transaction,
  to be Accepted again or Discarded. A Transaction already reversed
  gets 409 `/problems/transaction-already-reversed`; a reversal gets
  422 `/problems/transaction-is-a-reversal`, and the Opening balance
  Transaction 422 `/problems/opening-balance-transaction` (only
  voiding the first Statement import changes it). A Transaction booked
  in a closed month gets 409 `/problems/month-closed`, naming the
  `booking_month`: Reopen back to it first (ADR-0024).

  Reversing a Matched Transfer leg removes its Match. When the leg is
  an Accepted row's, a cash leg recorded automatically by that Accept
  is reversed with it; a cash leg entered by hand stays, In transit,
  to be Matched again. Reversing a cash leg alone leaves the other leg
  In transit. Reversing either leg of a Transfer between two cash
  Accounts reverses both. When any Transaction it would reverse is
  booked in a closed month of its Account, nothing is reversed: 409
  `/problems/month-closed`, naming that Account in `account_id`.

  Operation `reverseTransaction`.
