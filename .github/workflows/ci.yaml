# Pull request and main checks. Each job mirrors a Make target or a command
# you can run locally (docs/architecture/conventions.md, "CI").
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Kept in the workspace rather than ~/.cache, which setup-go does not cache.
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # Includes make lint-chart: helm lint and helm template of the chart with
      # every combination of database mode, Zitadel setup and UI slot, the
      # schema's rejections and kubeconform.
      - run: make lint

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make generate
      - name: Check the generated code is committed
        run: |
          if ! git diff --exit-code || [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated code is out of date. Run 'make generate' and commit the result."
            exit 1
          fi

  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - name: Check go.mod and go.sum are tidy
        run: |
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # testcontainers-go starts this image (databasetest.PostgresImage). Pulling
      # it first keeps the pull out of the tests' container start timeouts.
      - name: Pull the PostgreSQL image
        run: |
          image=$(sed -n 's/^const PostgresImage = "\(.*\)"$/\1/p' internal/platform/database/databasetest/databasetest.go)
          test -n "$image"
          docker pull "$image"
      - run: make test-integration

  # ADR-0019: fails when what the env repo's clusters/local renders to (with
  # this PR's chart and Dockerfile) uses an image or chart missing from its
  # images.lock. The env repo is private: the secret ENV_REPO_DEPLOY_KEY holds
  # a read-only deploy key of it (as in smoke.yaml). The repository variable
  # ENV_REPO_REF picks its branch (default main).
  images-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mumia/wallet-accountant-deploy
          ref: ${{ vars.ENV_REPO_REF || 'main' }}
          ssh-key: ${{ secrets.ENV_REPO_DEPLOY_KEY }}
          path: bin/env-repo
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # `flux install --export` is rendered too: the CLI's version is the Flux
      # whose controllers images.lock pins, which the env repo pins
      # (infra/homelab's flux_version; `make flux-version`).
      - name: Read the env repo's Flux version
        id: flux
        run: |
          version=$(make -s flux-version ENV_REPO=bin/env-repo)
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
      - uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1
        with:
          version: ${{ steps.flux.outputs.version }}
      - run: make images-lock-check ENV_REPO=bin/env-repo

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same build as `make docker-build`, with the GitHub Actions layer cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: wallet-accountant:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=go depName=golang.org/x/vuln
      GOVULNCHECK_VERSION: v1.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # Not a go.mod tool: its dependencies would join the app's module graph.
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
