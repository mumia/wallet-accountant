# Publishes Wallet Accountant to GHCR (ADR-0020; docs/architecture/conventions.md,
# "Releases"):
# - a semver tag (v1.2.3) publishes the image ghcr.io/mumia/wallet-accountant:v1.2.3
#   and the chart oci://ghcr.io/mumia/charts/wallet-accountant:1.2.3 (appVersion
#   v1.2.3), then creates the GitHub Release;
# - a push to main publishes the image ghcr.io/mumia/wallet-accountant:main-<sha>
#   for testing. Production never follows it.
# Every published artifact gets a build provenance attestation and a keyless
# cosign signature from this workflow's identity.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

# Never cancel a release half-way through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/mumia/wallet-accountant
  CHART: ghcr.io/mumia/charts/wallet-accountant

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.version.outputs.image-tag }}
      chart: ${{ steps.version.outputs.chart }}
      chart-version: ${{ steps.version.outputs.chart-version }}
      app-version: ${{ steps.version.outputs.app-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches, to check that a tag points into main.
          fetch-depth: 0
      # Fails on a tag that is not vMAJOR.MINOR.PATCH[-PRERELEASE].
      - id: version
        run: deploy/release/version.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      # A release is a commit that already passed CI on main.
      - name: Check the tag points into main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main. Tag a commit of main."
            exit 1
          fi
      # The tag's message starts the release notes, so it must have one.
      - name: Check the tag is annotated
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          if [ "$type" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Tag with git tag -a and write the upgrade notes in its message."
            exit 1
          fi

  image:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # linux/amd64 only: the production VM on Proxmox is x86-64, and local
      # clusters build the image from source for the host's architecture.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.image-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  chart:
    needs: [version, image]
    if: needs.version.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      CHART_VERSION: ${{ needs.version.outputs.chart-version }}
      APP_VERSION: ${{ needs.version.outputs.app-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # The chart's version and appVersion come from the tag; the chart then
      # defaults image.tag to the image published above.
      - run: make chart-package CHART_VERSION="$CHART_VERSION" APP_VERSION="$APP_VERSION"
      # cosign reads the Docker credentials; helm gets its own login.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log helm in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | "$(make -s print-helm)" registry login ghcr.io --username "$ACTOR" --password-stdin
      - id: push
        name: Push the chart
        run: |
          make chart-push CHART_VERSION="$CHART_VERSION" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' push.log)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Flux verifies this signature before installing the chart in production.
      - name: Sign the chart (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$CHART@$DIGEST"

  github-release:
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      # The notes are the tag's message (the upgrade notes), the published
      # artifacts, then GitHub's list of the pull requests merged since the
      # previous release (docs/architecture/conventions.md, "Releases").
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          CHART_VERSION: ${{ needs.version.outputs.chart-version }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .message > notes.md
          {
            echo
            echo "## Artifacts"
            echo
            echo "- Image: \`$IMAGE:$IMAGE_TAG\` (\`$IMAGE_DIGEST\`)"
            echo "- Chart: \`oci://$CHART\`, version \`$CHART_VERSION\` (\`$CHART_DIGEST\`)"
            echo
            echo "Both carry a build provenance attestation and a cosign keyless signature from \`.github/workflows/release.yaml\`. docs/architecture/conventions.md (\"Releases\") shows how to verify them."
          } >> notes.md
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes $prerelease
