# The end-to-end smoke test on the local cluster (spec "CI"): `make
# local-smoke` creates a k3d cluster online (local-up's prefetch downloads
# images.lock's images, charts and Go modules) from the env repo's
# clusters/local, deploys this commit's image and chart with the stand-in UI
# through the same local-* path a developer runs, bootstraps, redeems the code
# as a Zitadel identity, runs the stand-in UI's browser test and tears the
# cluster down. With it run the chart's helm lint and the images.lock check.
#
# It runs on every pull request that changes more than docs (ticket 08). A
# full run took 8 minutes on a developer's Mac and 13 to 25 here; if it stays
# over ~15 minutes, move it to pushes to main plus nightly
# (docs/architecture/conventions.md, "CI"). A pull request that only changes
# .scratch/, docs/ or Markdown skips local-smoke through `changes`, not
# paths-ignore: local-smoke is a required check, and a job skipped by its
# `if` counts as passed, while a workflow skipped by paths never reports.
#
# The env repo (mumia/wallet-accountant-deploy) is private: the secret
# ENV_REPO_DEPLOY_KEY holds a read-only deploy key of it. The repository
# variable ENV_REPO_REF picks its branch (default main).
name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change reaches beyond docs. Pushes to main and manual runs
  # always smoke.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside .scratch/, docs/ and Markdown files needs the smoke.
          if [ "$(git diff --name-only "$BASE...HEAD" | grep -cvE '^(\.scratch/|docs/)|\.md$')" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  local-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_REPO: ${{ github.workspace }}/wallet-accountant-deploy
      # The same versions as on a developer's Mac. flux's comes from the env
      # repo (infra/homelab's flux_version; `make flux-version`), whose
      # images.lock pins that release's controllers.
      # renovate: datasource=github-releases depName=k3d-io/k3d
      K3D_VERSION: v5.9.0
      # renovate: datasource=github-releases depName=FiloSottile/mkcert
      MKCERT_VERSION: v1.4.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the env repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mumia/wallet-accountant-deploy
          ref: ${{ vars.ENV_REPO_REF || 'main' }}
          path: wallet-accountant-deploy
          ssh-key: ${{ secrets.ENV_REPO_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install k3d, flux and mkcert
        run: |
          FLUX_VERSION=$(make -s flux-version)
          mkdir -p "$HOME/.local/bin"
          cd "$HOME/.local/bin"
          curl -fsSLo k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz" | tar xz flux
          curl -fsSLo mkcert "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
          chmod +x k3d flux mkcert
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The runner has no mkcert CA: this makes a new one, as on a new Mac.
      - run: make local-ca
      # helm lint and helm template of the chart, as in CI's lint job.
      - run: make lint-chart
      # Every image and chart clusters/local renders to (with this commit's
      # chart and Dockerfiles, the stand-in UI's included) is in the env repo's
      # images.lock (ADR-0019; as CI's images-lock job).
      - run: make images-lock-check
      - run: make local-smoke
      - name: Upload the browser test's traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stand-in-ui-results
          path: bin/stand-in-ui-results
          if-no-files-found: ignore
      # local-smoke deletes the cluster on exit; this covers a cancelled job.
      - name: Tear down
        if: always()
        run: k3d cluster delete wallet-accountant || true
