# The stand-in UI's server (docs/architecture/ui-contract.md): plain HTTP on
# 8080, /healthz, SPA fallback, and no caching of index.html and config.json.
server {
    listen 8080;
    server_name _;
    root /srv;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
