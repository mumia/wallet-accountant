{{- /*
One HTTPRoute for the app's host (ADR-0021): /api and /api/* to the app,
every other path to the UI when the slot is on. TLS ends at the Gateway
listener the parentRefs select.
*/ -}}
{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wa.fullname" . }}
  labels:
    {{- include "wa.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "wa.fullname" . }}
          port: 8080
    {{- if .Values.ui.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "wa.uiName" . }}
          port: 8080
    {{- end }}
{{- end }}
