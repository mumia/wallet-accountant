{{- /*
The OIDC settings the UI's config.json and the Make targets read: issuer,
audience and both client IDs.

It is an ordinary release resource with or without the Zitadel setup Job, so
turning the Job on or off on an installed release is an ordinary upgrade of
it. With the Job, the Job writes the client IDs Zitadel generated into its
data after every install and upgrade; the chart renders the client IDs the
ConfigMap already holds (none on the first install), so an upgrade never
reverts them. The UI starts from it before the post-install Job runs.
Flux's drift detection leaves it alone, since the Job changes it.
*/ -}}
{{- $setup := .Values.oidc.zitadelSetup.enabled }}
{{- $web := .Values.oidc.clientIds.web }}
{{- $apiClients := .Values.oidc.clientIds.apiClients }}
{{- if $setup }}
{{- $live := (lookup "v1" "ConfigMap" .Release.Namespace (include "wa.oidcConfigMap" .)).data | default dict }}
{{- $web = get $live "web-client-id" }}
{{- $apiClients = get $live "api-clients-client-id" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wa.oidcConfigMap" . }}
  labels:
    {{- include "wa.labels" . | nindent 4 }}
  {{- if $setup }}
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
  {{- end }}
data:
  issuer: {{ .Values.oidc.issuer | quote }}
  audience: {{ .Values.oidc.audience | quote }}
  web-client-id: {{ $web | quote }}
  api-clients-client-id: {{ $apiClients | quote }}
  config.json: {{ include "wa.uiConfig" (list . $web) | quote }}
