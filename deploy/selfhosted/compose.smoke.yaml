# Added to compose.yaml by smoke.sh only: Zitadel writes the setup machine
# user's personal access token to SMOKE_DIR instead of a volume, so the smoke
# check can also use it to set up a signed-in identity through the API.
services:
  zitadel-setup-volume:
    volumes:
      - ${SMOKE_DIR:?}:/zitadel-setup
  zitadel:
    volumes:
      - ${SMOKE_DIR:?}:/zitadel-setup
  zitadel-setup:
    volumes:
      - ${SMOKE_DIR:?}:/zitadel-setup:ro
